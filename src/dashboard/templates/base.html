<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}CloudMart Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">☁ CloudMart</div>
        <div class="env">Environment: {{ config.get("ENVIRONMENT", "dev") }}</div>

        {% if session.get("authenticated") and session.get("role") == "ADMIN" %}
        <div class="admin-user">
            <span>Signed in as</span>
            <strong>{{ session.get("name", "Admin") }}</strong>
        </div>

        <nav>
            <a href="{{ url_for('index') }}">Overview</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
        </nav>
        {% endif %}
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
