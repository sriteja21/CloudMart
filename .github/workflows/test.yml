name: Deploy CloudMart

on:
  push:
    branches:
      - order-api
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Application
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/application.yml \
            --stack-name cloudmart-application \
            --region $AWS_REGION \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy Event Driven
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/event-driven-stack.yml \
            --stack-name cloudmart-event-driven \
            --region $AWS_REGION \
            --parameter-overrides \
              Environment=dev \
              LowStockEmail=sriteja.a2103@gmail.com \
              OrderNotificationEmail=sriteja.a2103@gmail.com \
            --no-fail-on-empty-changeset