name: Test and Deploy Auth Stack

on:

  push:

    branches:
      - authorizer


# ==========================================================
# ENVIRONMENT
# ==========================================================

env:

  AWS_REGION: ap-south-1

  STACK_NAME: cloudmart-auth


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:

  id-token: write

  contents: read


# ==========================================================
# JOB
# ==========================================================

jobs:

  test-and-deploy:

    name: Test and Deploy Auth Stack

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ======================================================
      # INSTALL SAM
      # ======================================================

      - name: Install SAM CLI

        uses: aws-actions/setup-sam@v2


      # ======================================================
      # VALIDATE AUTH STACK
      # ======================================================

      - name: Validate Auth Stack

        run: |

          sam validate \
            --template-file infrastructure/cloudformation/auth-stack.yml


      # ======================================================
      # BUILD AUTH STACK
      # ======================================================

      - name: Build Auth Stack

        run: |

          sam build \
            --template-file infrastructure/cloudformation/auth-stack.yml


      # ======================================================
      # VERIFY IAM ROLE EXPORT
      # ======================================================

      - name: Verify Lambda Authorizer IAM Role Export

        run: |

          echo "Checking IAM stack export..."

          aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-LambdaAuthorizerRoleArn-dev'].[Name,Value]" \
            --output table


      # ======================================================
      # DEPLOY AUTH STACK
      # ======================================================

      - name: Deploy Auth Stack

        run: |

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset


      # ======================================================
      # DISPLAY CLOUDFORMATION OUTPUTS
      # ======================================================

      - name: Display Auth Stack Outputs

        run: |

          echo "=============================================="

          echo "Auth Stack Outputs"

          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


      # ======================================================
      # VERIFY LAMBDA
      # ======================================================

      - name: Verify Lambda Authorizer

        run: |

          aws lambda get-function \
            --function-name CloudMart-Lambda-Authorizer-dev \
            --region "$AWS_REGION"


      # ======================================================
      # SUCCESS
      # ======================================================

      - name: Deployment Successful

        run: |

          echo "=============================================="

          echo "CloudMart Auth Stack deployed successfully."

          echo "=============================================="