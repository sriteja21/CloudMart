name: CloudMart Deploy
on:
  push:
    branches:
      - main
      - order-api

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # 1. VALIDATE
  # ==========================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation
        run: |
          set -e

          for template in infrastructure/cloudformation/*.yml; do
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://$template" \
              >/dev/null
          done

          echo "Validation successful"


  # ==========================================================
  # 2. NETWORK
  # ==========================================================
  network:
    name: Network
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yml \
            --stack-name cloudmart-network \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

          echo "Network deployment successful"


  # ==========================================================
  # 3. DATABASE
  # ==========================================================
  database:
    name: Database
    needs: network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Database
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/data.yml \
            --stack-name cloudmart-data \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

          echo "Database deployment successful"

      - name: Wait for RDS
        run: |
          DB_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseIdentifier'].OutputValue | [0]" \
            --output text)

          if [ -n "$DB_ID" ] && [ "$DB_ID" != "None" ]; then
            echo "Waiting for RDS instance: $DB_ID"

            aws rds wait db-instance-available \
              --db-instance-identifier "$DB_ID" \
              --region "$AWS_REGION"
          fi

          echo "RDS available"


  # ==========================================================
  # 4. IAM
  # ==========================================================
  iam:
    name: IAM
    needs: database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/iam.yml \
            --stack-name cloudmart-iam \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "IAM deployment successful"

      - name: Verify IAM Exports
        run: |
          set -e

          for export in \
            CloudMart-LambdaExecutionRoleArn-dev \
            CloudMart-LambdaAuthorizerRoleArn-dev \
            CloudMart-DatabaseEndpoint \
            CloudMart-DatabaseSecretArn
          do
            echo "Checking export: $export"

            VALUE=$(aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='$export'].Value | [0]" \
              --output text)

            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Missing export: $export"
              exit 1
            fi

            echo "Verified: $export"
          done

          echo "IAM exports verified"


  # ==========================================================
  # 5. AUTH
  # ==========================================================
  auth:
    name: Auth
    needs: iam
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate Auth
        run: |
          sam validate \
            --template-file infrastructure/cloudformation/auth-stack.yml

      - name: Build Auth
        run: |
          sam build \
            --template-file infrastructure/cloudformation/auth-stack.yml

      - name: Deploy Auth
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-auth \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Auth deployment successful"

      - name: Verify Authorizer
        run: |
          aws lambda get-function \
            --function-name CloudMart-Lambda-Authorizer-dev \
            --region "$AWS_REGION" \
            >/dev/null

          echo "Authorizer verified"


  # ==========================================================
  # 6. EVENT DRIVEN
  # ==========================================================
  event-driven:
    name: Event Driven
    needs: auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Email Secrets
        run: |
          set -e

          if [ -z "${{ secrets.LOW_STOCK_EMAIL }}" ]; then
            echo "LOW_STOCK_EMAIL secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.ORDER_NOTIFICATION_EMAIL }}" ]; then
            echo "ORDER_NOTIFICATION_EMAIL secret is missing"
            exit 1
          fi

          echo "Required email secrets are available"

      - name: Deploy Event Driven Stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/event-driven-stack.yml \
            --stack-name cloudmart-event-driven \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
              OrderNotificationEmail="${{ secrets.ORDER_NOTIFICATION_EMAIL }}" \
            --no-fail-on-empty-changeset

          echo "Event-driven deployment successful"

      - name: Verify Event Driven Stack
        run: |
          set -e

          TOPIC=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-LowStockTopicArn'].Value | [0]" \
            --output text)

          BUS=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-EventBusName'].Value | [0]" \
            --output text)

          if [ -z "$TOPIC" ] || [ "$TOPIC" = "None" ]; then
            echo "Low stock SNS topic export is missing"
            exit 1
          fi

          if [ -z "$BUS" ] || [ "$BUS" = "None" ]; then
            echo "EventBridge bus export is missing"
            exit 1
          fi

          echo "SNS and EventBridge verified"


  # ==========================================================
  # 7. APPLICATION / PRODUCT + ORDER API
  # ==========================================================
  application:
    name: Product API
    needs: event-driven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate Product API
        run: |
          sam validate \
            --template-file infrastructure/cloudformation/application.yml

      - name: Build Product API
        run: |
          sam build \
            --template-file infrastructure/cloudformation/application.yml

      - name: Verify Build
        run: |
          set -e

          test -f .aws-sam/build/ProductApiFunction/lambda_function.py
          test -f .aws-sam/build/ProductApiFunction/schema.sql

          echo "Product API build verified"

      - name: Deploy Product API
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Product API deployment successful"