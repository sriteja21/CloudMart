name: CloudMart Infrastructure Deployment

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  push:
    branches:
      - main
      - dashboard

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:

  AWS_REGION: ap-south-1

  CFN_BUCKET: cloudmart-cfn-templates

  ENVIRONMENT: dev

  REPORT_S3_BUCKET_NAME: cloudmart-dev-reports-test

  DASHBOARD_STACK_NAME: CloudMart-Dashboard-dev


# ============================================================
# GITHUB OIDC PERMISSIONS
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # JOB 1: LINT AND VALIDATE ALL CLOUDFORMATION TEMPLATES
  # ==========================================================

  validate-cloudformation:

    name: Lint and Validate CloudFormation

    runs-on: ubuntu-latest

    steps:


      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Install cfn-lint
      # ------------------------------------------------------

      - name: Install cfn-lint

        run: |

          python -m pip install --upgrade pip

          pip install cfn-lint


      # ------------------------------------------------------
      # Find and lint ALL CloudFormation templates
      # ------------------------------------------------------

      - name: Lint all CloudFormation templates

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Searching for CloudFormation templates..."

          echo "=============================================="


          mapfile -t templates < <(

            find infrastructure/cloudformation \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \)

          )


          if [ ${#templates[@]} -eq 0 ]; then

            echo "ERROR: No CloudFormation templates found."

            exit 1

          fi


          echo ""

          echo "Templates found:"

          printf '%s\n' "${templates[@]}"


          echo ""

          echo "=============================================="

          echo "Starting cfn-lint"

          echo "=============================================="


          for template in "${templates[@]}"

          do

            echo ""

            echo "----------------------------------------------"

            echo "Linting: $template"

            echo "----------------------------------------------"


            cfn-lint "$template"


            echo "Lint successful: $template"

          done


          echo ""

          echo "=============================================="

          echo "All CloudFormation templates passed cfn-lint"

          echo "=============================================="


      # ------------------------------------------------------
      # Configure AWS credentials
      # ------------------------------------------------------

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # Verify AWS authentication
      # ------------------------------------------------------

      - name: Verify AWS identity

        run: |

          echo "Checking AWS identity..."

          aws sts get-caller-identity

          echo "AWS authentication successful."


      # ------------------------------------------------------
      # AWS CloudFormation validation
      # ------------------------------------------------------

      - name: Validate all CloudFormation templates

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Starting AWS CloudFormation validation"

          echo "=============================================="


          mapfile -t templates < <(

            find infrastructure/cloudformation \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \)

          )


          for template in "${templates[@]}"

          do

            echo ""

            echo "----------------------------------------------"

            echo "AWS validating: $template"

            echo "----------------------------------------------"


            aws cloudformation validate-template \
              --template-body "file://$template"


            echo "AWS validation successful: $template"

          done


          echo ""

          echo "=============================================="

          echo "All CloudFormation templates passed AWS validation"

          echo "=============================================="


  # ==========================================================
  # JOB 2: CREATE S3 BUCKET AND UPLOAD CLOUDFORMATION
  # ==========================================================

  upload-cloudformation:

    name: Upload CloudFormation Templates to S3

    needs:
      - validate-cloudformation

    runs-on: ubuntu-latest

    steps:


      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Configure AWS credentials
      # ------------------------------------------------------

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # Verify AWS authentication
      # ------------------------------------------------------

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Create S3 bucket if required
      # ------------------------------------------------------

      - name: Create CloudFormation S3 bucket if needed

        shell: bash

        run: |

          set -e

          BUCKET_NAME="${CFN_BUCKET}"


          echo "=============================================="

          echo "Checking S3 bucket"

          echo "Bucket: ${BUCKET_NAME}"

          echo "Region: ${AWS_REGION}"

          echo "=============================================="


          if aws s3api head-bucket \
            --bucket "${BUCKET_NAME}" \
            2>/dev/null

          then

            echo ""

            echo "S3 bucket already exists."

            echo "No bucket creation required."

          else

            echo ""

            echo "S3 bucket does not exist."

            echo "Creating bucket..."


            if [ "${AWS_REGION}" = "us-east-1" ]; then

              aws s3api create-bucket \
                --bucket "${BUCKET_NAME}" \
                --region "${AWS_REGION}"

            else

              aws s3api create-bucket \
                --bucket "${BUCKET_NAME}" \
                --region "${AWS_REGION}" \
                --create-bucket-configuration \
                  LocationConstraint="${AWS_REGION}"

            fi


            echo ""

            echo "S3 bucket created successfully."

          fi


      # ------------------------------------------------------
      # Enable S3 versioning
      # ------------------------------------------------------

      - name: Enable S3 bucket versioning

        run: |

          set -e

          echo "Enabling S3 bucket versioning..."


          aws s3api put-bucket-versioning \
            --bucket "${CFN_BUCKET}" \
            --versioning-configuration Status=Enabled


          echo "S3 bucket versioning enabled."


      # ------------------------------------------------------
      # Upload CloudFormation templates
      # ------------------------------------------------------

      - name: Upload CloudFormation templates to S3

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Uploading CloudFormation templates to S3"

          echo "=============================================="


          aws s3 sync \
            infrastructure/cloudformation/ \
            "s3://${CFN_BUCKET}/cloudformation/" \
            --exclude "*" \
            --include "*.yml" \
            --include "*.yaml"


          echo ""

          echo "CloudFormation templates uploaded successfully."


      # ------------------------------------------------------
      # Display uploaded templates
      # ------------------------------------------------------

      - name: List CloudFormation templates in S3

        run: |

          echo "=============================================="

          echo "CloudFormation templates currently in S3"

          echo "=============================================="


          aws s3 ls \
            "s3://${CFN_BUCKET}/cloudformation/" \
            --recursive


  # ==========================================================
  # JOB 3: DEPLOY NETWORK STACK
  # ==========================================================

  deploy-network:

    name: Deploy Network Stack

    needs:
      - upload-cloudformation

    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Deploy Network Stack
      # ------------------------------------------------------

      - name: Deploy Network Stack

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Deploying CloudMart Network Stack"

          echo "=============================================="


          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yml \
            --stack-name cloudmart-network \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


          echo ""

          echo "Network Stack deployment completed successfully."


      - name: Display Network Stack outputs

        run: |

          echo "=============================================="

          echo "Network Stack Outputs"

          echo "=============================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-network \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # ==========================================================
  # JOB 4: DEPLOY DATA STACK
  # ==========================================================

  deploy-data:

    name: Deploy Data Stack

    needs:
      - deploy-network

    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Deploy Data Stack
      # ------------------------------------------------------

      - name: Deploy Data Stack

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Deploying CloudMart Data Stack"

          echo "=============================================="


          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/data.yml \
            --stack-name cloudmart-data \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


          echo ""

          echo "Data Stack deployment completed successfully."


      - name: Display Data Stack outputs

        run: |

          echo "=============================================="

          echo "Data Stack Outputs"

          echo "=============================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # ==========================================================
  # JOB 5: DEPLOY IAM STACK
  # ==========================================================

  deploy-iam:

    name: Deploy IAM Stack

    needs:
      - deploy-data

    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Deploy IAM Stack
      # ------------------------------------------------------

      - name: Deploy IAM Stack

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Deploying CloudMart IAM Stack"

          echo "=============================================="


          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/iam.yml \
            --stack-name cloudmart-iam \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


          echo ""

          echo "IAM Stack deployment completed successfully."


      # ------------------------------------------------------
      # Verify Lambda Authorizer IAM role export
      # ------------------------------------------------------

      - name: Verify Lambda Authorizer IAM Role Export

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Checking Lambda Authorizer IAM Role Export"

          echo "=============================================="


          EXPORT_VALUE=$(
            aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='CloudMart-LambdaAuthorizerRoleArn-dev'].Value | [0]" \
              --output text
          )


          if [ -z "$EXPORT_VALUE" ] || [ "$EXPORT_VALUE" = "None" ]; then

            echo "ERROR: Lambda Authorizer IAM role export was not found."

            echo "Expected export: CloudMart-LambdaAuthorizerRoleArn-dev"

            exit 1

          fi


          echo "Lambda Authorizer IAM role export found."

          echo "Export value: $EXPORT_VALUE"


      - name: Display IAM Stack outputs

        run: |

          echo "=============================================="

          echo "IAM Stack Outputs"

          echo "=============================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # ==========================================================
  # JOB 6: TEST AND DEPLOY AUTH STACK
  # ==========================================================

  deploy-auth:

    name: Test and Deploy Auth Stack

    needs:
      - deploy-iam

    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Install AWS SAM CLI
      # ------------------------------------------------------

      - name: Install SAM CLI

        uses: aws-actions/setup-sam@v2


      # ------------------------------------------------------
      # Validate Auth Stack
      # ------------------------------------------------------

      - name: Validate Auth Stack

        run: |

          sam validate \
            --template-file infrastructure/cloudformation/auth-stack.yml


      # ------------------------------------------------------
      # Build Auth Stack
      # ------------------------------------------------------

      - name: Build Auth Stack

        run: |

          sam build \
            --template-file infrastructure/cloudformation/auth-stack.yml


      # ------------------------------------------------------
      # Verify IAM role export
      # ------------------------------------------------------

      - name: Verify Lambda Authorizer IAM Role Export

        run: |

          echo "=============================================="

          echo "Checking IAM stack export..."

          echo "=============================================="


          aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-LambdaAuthorizerRoleArn-dev'].[Name,Value]" \
            --output table


      # ------------------------------------------------------
      # Deploy Auth Stack
      # ------------------------------------------------------

      - name: Deploy Auth Stack

        run: |

          set -e

          echo "=============================================="

          echo "Deploying CloudMart Auth Stack"

          echo "=============================================="


          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-auth \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset


          echo ""

          echo "Auth Stack deployment completed successfully."


      - name: Display Auth Stack Outputs

        run: |

          echo "=============================================="

          echo "Auth Stack Outputs"

          echo "=============================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-auth \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


      - name: Verify Lambda Authorizer

        run: |

          set -e

          echo "=============================================="

          echo "Verifying Lambda Authorizer"

          echo "=============================================="


          aws lambda get-function \
            --function-name CloudMart-Lambda-Authorizer-dev \
            --region "$AWS_REGION"


          echo ""

          echo "Lambda Authorizer verification successful."


      - name: Deployment Successful

        run: |

          echo ""

          echo "=============================================="

          echo "CloudMart Auth Stack deployed successfully."

          echo "=============================================="


  # ==========================================================
  # JOB 7: DEPLOY DASHBOARD STACK
  # ==========================================================

  deploy-dashboard:

    name: Deploy CloudMart Dashboard Stack

    needs:
      - deploy-auth

    runs-on: ubuntu-latest

    steps:


      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Configure AWS credentials
      # ------------------------------------------------------

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # Verify AWS identity
      # ------------------------------------------------------

      - name: Verify AWS identity

        run: |

          echo "Checking AWS identity..."

          aws sts get-caller-identity


      # ------------------------------------------------------
      # Validate Dashboard Stack
      # ------------------------------------------------------

      - name: Validate Dashboard Stack

        run: |

          set -e

          echo "=============================================="

          echo "Validating CloudMart Dashboard Stack"

          echo "=============================================="


          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/dashboard-stack.yml


          echo ""

          echo "Dashboard stack validation successful."


      # ------------------------------------------------------
      # Verify required exports
      # ------------------------------------------------------

      - name: Verify Dashboard Dependencies

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Checking Dashboard Stack Dependencies"

          echo "=============================================="


          echo ""

          echo "Checking EC2 Instance Profile export..."

          INSTANCE_PROFILE=$(
            aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='CloudMart-DashboardEC2InstanceProfileArn-dev'].Value | [0]" \
              --output text
          )


          if [ -z "$INSTANCE_PROFILE" ] || [ "$INSTANCE_PROFILE" = "None" ]; then

            echo "ERROR: Dashboard EC2 Instance Profile export not found."

            echo "Expected: CloudMart-DashboardEC2InstanceProfileArn-dev"

            exit 1

          fi


          echo "Instance Profile export found:"

          echo "$INSTANCE_PROFILE"


          echo ""

          echo "Checking EC2 Security Group export..."

          EC2_SG=$(
            aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='CloudMart-EC2-SG'].Value | [0]" \
              --output text
          )


          if [ -z "$EC2_SG" ] || [ "$EC2_SG" = "None" ]; then

            echo "ERROR: CloudMart-EC2-SG export not found."

            exit 1

          fi


          echo "EC2 Security Group export found:"

          echo "$EC2_SG"


          echo ""

          echo "Checking Public Subnet export..."

          PUBLIC_SUBNET=$(
            aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='CloudMart-Public-Subnet-ID'].Value | [0]" \
              --output text
          )


          if [ -z "$PUBLIC_SUBNET" ] || [ "$PUBLIC_SUBNET" = "None" ]; then

            echo "ERROR: CloudMart-Public-Subnet-ID export not found."

            exit 1

          fi


          echo "Public subnet export found:"

          echo "$PUBLIC_SUBNET"


          echo ""

          echo "All Dashboard dependencies verified."


      # ------------------------------------------------------
      # Deploy Dashboard Stack
      # ------------------------------------------------------

      - name: Deploy CloudMart Dashboard Stack

        shell: bash

        run: |

          set -e

          echo "=============================================="

          echo "Deploying CloudMart Dashboard Stack"

          echo "=============================================="


          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/dashboard-stack.yml \
            --stack-name "$DASHBOARD_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              InstanceType=t3.micro \
              ReportS3BucketName="$REPORT_S3_BUCKET_NAME" \
            --no-fail-on-empty-changeset


          echo ""

          echo "=============================================="

          echo "CloudMart Dashboard Stack deployment completed."

          echo "=============================================="


      # ------------------------------------------------------
      # Wait for Dashboard Stack
      # ------------------------------------------------------

      - name: Wait for Dashboard Stack

        shell: bash

        run: |

          set -e

          echo "Waiting for Dashboard stack to complete..."


          aws cloudformation wait stack-create-complete \
            --stack-name "$DASHBOARD_STACK_NAME" \
            --region "$AWS_REGION" \
          || \
          aws cloudformation wait stack-update-complete \
            --stack-name "$DASHBOARD_STACK_NAME" \
            --region "$AWS_REGION"


          echo ""

          echo "Dashboard stack is in a completed state."


      # ------------------------------------------------------
      # Display Dashboard Outputs
      # ------------------------------------------------------

      - name: Display Dashboard Stack Outputs

        run: |

          echo "=============================================="

          echo "CloudMart Dashboard Stack Outputs"

          echo "=============================================="


          aws cloudformation describe-stacks \
            --stack-name "$DASHBOARD_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


      # ------------------------------------------------------
      # Get Dashboard Public IP
      # ------------------------------------------------------

      - name: Get Dashboard Public IP

        shell: bash

        run: |

          set -e

          DASHBOARD_IP=$(
            aws cloudformation describe-stacks \
              --stack-name "$DASHBOARD_STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='DashboardPublicIP'].OutputValue | [0]" \
              --output text
          )


          echo ""

          echo "=============================================="

          echo "CloudMart Dashboard"

          echo "=============================================="

          echo "Public IP: $DASHBOARD_IP"

          echo "Dashboard URL: http://${DASHBOARD_IP}"

          echo "=============================================="


  # ==========================================================
  # JOB 8: COMPLETE DEPLOYMENT
  # ==========================================================

  deployment-complete:

    name: CloudMart Deployment Complete

    needs:
      - deploy-dashboard

    runs-on: ubuntu-latest

    steps:

      - name: Deployment Complete

        run: |

          echo ""

          echo "===================================================="

          echo "        CLOUDMART DEPLOYMENT SUCCESSFUL"

          echo "===================================================="

          echo ""

          echo "Stacks deployed successfully:"

          echo ""

          echo "1. cloudmart-network"

          echo "2. cloudmart-data"

          echo "3. cloudmart-iam"

          echo "4. cloudmart-auth"

          echo "5. CloudMart-Dashboard-dev"

          echo ""

          echo "Lambda Authorizer:"

          echo "CloudMart-Lambda-Authorizer-dev"

          echo ""

          echo "Dashboard:"

          echo "CloudMart-Dashboard-dev"

          echo ""

          echo "===================================================="