name: Test and Deploy Product API

on:
  push:
    branches:
      - product-api

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  STACK_NAME: cloudmart-application

permissions:
  id-token: write
  contents: read

jobs:

  test-and-deploy:

    name: Test and Deploy Product API
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ======================================================
      # INSTALL SAM
      # ======================================================

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2


      # ======================================================
      # VERIFY PROJECT FILES
      # ======================================================

      - name: Verify Product API files
        run: |
          set -e

          test -f infrastructure/cloudformation/application.yml
          test -f src/product/lambda_function.py
          test -f src/product/requirements.txt
          test -f src/product/schema.sql

          echo "All Product API files exist."


      # ======================================================
      # VALIDATE SAM TEMPLATE
      # ======================================================

      - name: Validate Product API
        run: |
          set -e

          sam validate \
            --template-file infrastructure/cloudformation/application.yml

          echo "SAM validation successful."


      # ======================================================
      # BUILD PRODUCT API
      # ======================================================

      - name: Build Product API
        run: |
          set -e

          sam build \
            --template-file infrastructure/cloudformation/application.yml

          echo "SAM build successful."


      # ======================================================
      # VERIFY BUILD OUTPUT
      # ======================================================

      - name: Verify SAM build
        run: |
          set -e

          echo "Build directory:"
          ls -la .aws-sam/build/

          echo ""
          echo "Product Lambda package:"
          ls -la .aws-sam/build/ProductApiFunction/

          test -f .aws-sam/build/ProductApiFunction/lambda_function.py
          test -f .aws-sam/build/ProductApiFunction/schema.sql

          echo ""
          echo "Lambda source and schema.sql are included."


      # ======================================================
      # VERIFY LAMBDA IAM ROLE
      # ======================================================

      - name: Verify Lambda execution role
        run: |
          set -e

          ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-LambdaExecutionRoleArn-dev'].Value | [0]" \
            --output text)

          if [ "$ROLE" = "None" ] || [ -z "$ROLE" ]; then
            echo "Lambda execution role export not found."
            exit 1
          fi

          echo "Lambda execution role:"
          echo "$ROLE"


      # ======================================================
      # VERIFY AUTHORIZER
      # ======================================================

      - name: Verify Lambda Authorizer
        run: |
          set -e

          AUTHORIZER=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-Lambda-Authorizer-Arn-dev'].Value | [0]" \
            --output text)

          if [ "$AUTHORIZER" = "None" ] || [ -z "$AUTHORIZER" ]; then
            echo "Lambda Authorizer export not found."
            exit 1
          fi

          echo "Lambda Authorizer:"
          echo "$AUTHORIZER"


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy Product API
        run: |
          set -e

          echo "=============================================="
          echo "Deploying CloudMart Product API"
          echo "=============================================="

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Deployment successful."


      # ======================================================
      # CLOUDFORMATION OUTPUTS
      # ======================================================

      - name: Display stack outputs
        run: |
          echo "=============================================="
          echo "Product API Stack Outputs"
          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


      # ======================================================
      # GET API URL
      # ======================================================

      - name: Get Product API URL
        id: api
        run: |
          set -e

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiUrl'].OutputValue | [0]" \
            --output text)

          if [ "$API_URL" = "None" ] || [ -z "$API_URL" ]; then
            echo "Product API URL not found."
            exit 1
          fi

          echo "Product API URL:"
          echo "$API_URL"

          echo "url=$API_URL" >> "$GITHUB_OUTPUT"


      # ======================================================
      # VERIFY PRODUCT LAMBDA
      # ======================================================

      - name: Verify Product Lambda
        run: |
          set -e

          aws lambda get-function \
            --function-name CloudMart-Product-API-dev \
            --region "$AWS_REGION"

          echo "Product Lambda exists."


      # ======================================================
      # TEST WITHOUT TOKEN
      # ======================================================

      - name: Test unauthorized request
        run: |
          set -e

          URL="${{ steps.api.outputs.url }}/product"

          echo "Testing:"
          echo "$URL"

          STATUS=$(curl \
            --silent \
            --output /tmp/unauthorized.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP status: $STATUS"
          cat /tmp/unauthorized.json

          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Unauthorized request was not rejected."
            exit 1
          fi

          echo "Unauthorized request correctly rejected."


      # ======================================================
      # TEST INVALID TOKEN
      # ======================================================

      - name: Test invalid token
        run: |
          set -e

          URL="${{ steps.api.outputs.url }}/product"

          STATUS=$(curl \
            --silent \
            --output /tmp/invalid.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer invalid-token" \
            "$URL")

          echo "HTTP status: $STATUS"
          cat /tmp/invalid.json

          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Invalid token was not rejected."
            exit 1
          fi

          echo "Invalid token correctly rejected."


      # ======================================================
      # GET VALID TOKEN FROM SSM
      # ======================================================

      - name: Get development auth token
        id: token
        run: |
          set -e

          TOKEN=$(aws ssm get-parameter \
            --name "/app/dev/auth/token" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text \
            --region "$AWS_REGION")

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "Auth token was not found."
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # TEST VALID TOKEN
      # ======================================================

      - name: Test valid authorization
        run: |
          set -e

          URL="${{ steps.api.outputs.url }}/product"

          STATUS=$(curl \
            --silent \
            --output /tmp/authorized.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            "$URL")

          echo "HTTP status: $STATUS"
          cat /tmp/authorized.json

          if [ "$STATUS" -ge 500 ]; then
            echo "Product API returned a server error."
            exit 1
          fi

          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "Valid token was rejected."
            exit 1
          fi

          echo "Valid token accepted."


      # ======================================================
      # TEST CREATE PRODUCT
      # ======================================================

      - name: Test create product
        run: |
          set -e

          URL="${{ steps.api.outputs.url }}/product"

          STATUS=$(curl \
            --silent \
            --output /tmp/create.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -d '{
              "name": "Test Product",
              "description": "GitHub Actions test product",
              "price": 99.99,
              "category": "Test",
              "quantity_available": 10,
              "reorder_threshold": 2
            }' \
            "$URL")

          echo "HTTP status: $STATUS"
          cat /tmp/create.json

          if [ "$STATUS" != "201" ]; then
            echo "Product creation failed."
            exit 1
          fi

          echo "Product creation successful."


      # ======================================================
      # TEST GET PRODUCTS
      # ======================================================

      - name: Test get products
        run: |
          set -e

          URL="${{ steps.api.outputs.url }}/product"

          STATUS=$(curl \
            --silent \
            --output /tmp/products.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            "$URL")

          echo "HTTP status: $STATUS"
          cat /tmp/products.json

          if [ "$STATUS" != "200" ]; then
            echo "GET /product failed."
            exit 1
          fi

          echo "GET /product successful."


      # ======================================================
      # SUCCESS
      # ======================================================

      - name: Deployment successful
        run: |
          echo ""
          echo "===================================================="
          echo "     CLOUDMART PRODUCT API DEPLOYMENT SUCCESS"
          echo "===================================================="
          echo ""
          echo "API:"
          echo "${{ steps.api.outputs.url }}"
          echo ""
          echo "Routes:"
          echo "GET    /product"
          echo "POST   /product"
          echo "GET    /product/{id}"
          echo "PUT    /product/{id}"
          echo "DELETE /product/{id}"
          echo ""
          echo "Authentication:"
          echo "Lambda Authorizer"
          echo ""
          echo "Database:"
          echo "RDS MySQL"
          echo ""
          echo "Database initialization:"
          echo "schema.sql executed by Product Lambda"
          echo ""
          echo "===================================================="