name: CloudMart Deploy Pipeline

on:
  push:
    branches:
      - main
      - changes 
  workflow_dispatch:

# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================
env:
  AWS_REGION: ap-south-1
  SAM_CLI_TELEMETRY: 0

# ==========================================================
# PERMISSIONS
# ==========================================================
permissions:
  id-token: write
  contents: read

# ==========================================================
# JOBS
# ==========================================================
jobs:

  # ==========================================================
  # 1. VALIDATE STACK
  # ==========================================================
  validate-templates:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run CloudFormation Template Validation
        run: |
          set -e
          echo "=============================================="
          echo "Validating CloudFormation Templates"
          echo "=============================================="

          for template in infrastructure/cloudformation/*.yml
          do
            echo ""
            echo "Validating: $template"
            aws cloudformation validate-template \
              --template-body "file://$template" \
              --region "$AWS_REGION" \
              >/dev/null
            echo "Validation successful: $template"
          done

          echo ""
          echo "=============================================="
          echo "All CloudFormation templates are valid"
          echo "=============================================="

  # ==========================================================
  # 2. NETWORK STACK
  # ==========================================================
  deploy-network-stack:
    name: Deploy Network Stack
    needs: validate-templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Network Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Network Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yml \
            --stack-name cloudmart-dev-network-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json \
            --no-fail-on-empty-changeset

          echo "Network deployment successful."

  # ==========================================================
  # 3. DATABASE STACK
  # ==========================================================
  deploy-database-stack:
    name: Deploy Database Stack
    needs: deploy-network-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Database Password Secret
        run: |
          set -e
          if [ -z "${{ secrets.DB_PASSWORD }}" ]
          then
            echo "DB_PASSWORD secret is missing"
            exit 1
          fi
          echo "DB_PASSWORD secret is available."

      - name: Execute Database Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Database Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/data.yml \
            --stack-name cloudmart-dev-data-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json DBMasterUserPassword="${{ secrets.DB_PASSWORD }}" \
            --no-fail-on-empty-changeset

          echo "Database deployment successful."

      - name: Await RDS Instance Availability
        run: |
          set -e
          DB_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseIdentifier'].OutputValue | [0]" \
            --output text)

          if [ -n "$DB_ID" ] && [ "$DB_ID" != "None" ]
          then
            echo "Waiting for RDS instance: $DB_ID"
            aws rds wait db-instance-available \
              --db-instance-identifier "$DB_ID" \
              --region "$AWS_REGION"
          fi
          echo "RDS is available."

  # ==========================================================
  # 4. IAM STACK
  # ==========================================================
  deploy-iam-stack:
    name: Deploy IAM Stack
    needs: deploy-database-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute IAM Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart IAM Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/iam.yml \
            --stack-name cloudmart-dev-iam-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "IAM deployment successful."

      - name: Verify IAM Stack Exports
        run: |
          set -e
          echo "Checking IAM exports..."

          for export in \
            CloudMart-LambdaExecutionRoleArn-dev \
            CloudMart-LambdaAuthorizerRoleArn-dev \
            CloudMart-DatabaseEndpoint \
            CloudMart-DatabasePort \
            CloudMart-DatabaseName \
            CloudMart-DashboardEC2RoleArn-dev \
            CloudMart-DashboardEC2InstanceProfileArn-dev
          do
            echo "Checking export: $export"
            VALUE=$(aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='$export'].Value | [0]" \
              --output text)

            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]
            then
              echo "Missing export: $export"
              exit 1
            fi
            echo "Verified: $export"
          done
          echo "All required IAM exports verified."

  # ==========================================================
  # 5. AUTHORIZER & INIT SCHEMA STACK
  # ==========================================================
  deploy-auth-stack:
    name: Deploy Authorizer Stack
    needs: deploy-iam-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Verify Source Directories
        run: |
          set -e
          echo "=============================================="
          echo "Verifying Auth & Init Schema Source Files"
          echo "=============================================="
          
          if [ -d "src/authorizer" ] && [ -d "src/init-schema" ]; then
            echo "Source directories exist."
          else
            echo "Error: Authorizer or Init-Schema directory is missing."
            exit 1
          fi

      - name: Validate Authorizer SAM Template
        run: |
          set -e
          sam validate \
            --template-file infrastructure/cloudformation/auth-stack.yml

          echo "Authorizer template validation successful."

      - name: Build Authorizer Artifacts
        run: |
          set -e
          sam build \
            --template-file infrastructure/cloudformation/auth-stack.yml

          echo "Authorizer build successful."

      - name: Execute Authorizer Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Authorizer Stack"
          echo "=============================================="

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-dev-auth-stack \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides file://parameters.json \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Authorizer deployment successful."

      - name: Verify Authorizer Lambda Function
        run: |
          set -e
          aws lambda list-functions \
            --region "$AWS_REGION" \
            --query "Functions[?contains(FunctionName, 'Authorizer')].FunctionName | [0]" \
            --output text >/dev/null

          echo "Authorizer Lambda verified."

  # ==========================================================
  # 6. EVENT DRIVEN STACK
  # ==========================================================
  deploy-event-driven-stack:
    name: Deploy Event-Driven Stack
    needs: deploy-auth-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Email Notification Secrets
        run: |
          set -e
          if [ -z "${{ secrets.LOW_STOCK_EMAIL }}" ]
          then
            echo "LOW_STOCK_EMAIL secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.ORDER_NOTIFICATION_EMAIL }}" ]
          then
            echo "ORDER_NOTIFICATION_EMAIL secret is missing"
            exit 1
          fi

          echo "Required email secrets are available."

      - name: Execute Event-Driven Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Event-Driven Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/event-driven-stack.yml \
            --stack-name cloudmart-dev-event-driven-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" OrderNotificationEmail="${{ secrets.ORDER_NOTIFICATION_EMAIL }}" \
            --no-fail-on-empty-changeset

          echo "Event-driven deployment successful."

      - name: Verify Event-Driven Stack Exports
        run: |
          set -e
          TOPIC=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?contains(Name, 'LowStockTopicArn')].Value | [0]" \
            --output text)

          BUS=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?contains(Name, 'EventBusName')].Value | [0]" \
            --output text)

          if [ -z "$TOPIC" ] || [ "$TOPIC" = "None" ]
          then
            echo "Low Stock SNS topic export is missing"
            exit 1
          fi

          if [ -z "$BUS" ] || [ "$BUS" = "None" ]
          then
            echo "EventBridge bus export is missing"
            exit 1
          fi

          echo "SNS and EventBridge verified."

  # ==========================================================
  # 7. APPLICATION STACK (Product, Customer, Order APIs)
  # ==========================================================
  deploy-application-stack:
    name: Deploy Application Stack
    needs: deploy-event-driven-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate Application SAM Template
        run: |
          set -e
          sam validate \
            --template-file infrastructure/cloudformation/application.yml

          echo "Application template validation successful."

      - name: Build Application Artifacts
        run: |
          set -e
          sam build \
            --template-file infrastructure/cloudformation/application.yml

          echo "Application build successful."

      - name: Verify Application Build Output
        run: |
          set -e
          test -f .aws-sam/build/ProductApiFunction/lambda_function.py
          test -f .aws-sam/build/CustomerApiFunction/lambda_function.py
          test -f .aws-sam/build/OrderApiFunction/lambda_function.py

          echo "Product, Customer, and Order API builds verified."

      - name: Execute Application Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Application Stack"
          echo "=============================================="

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-dev-application-stack \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides file://parameters.json \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Application deployment successful."

      - name: Display Application Stack Outputs
        run: |
          echo "=============================================="
          echo "Application Stack Outputs"
          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-application-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

  # ==========================================================
  # 8. REPORTING STACK
  # ==========================================================
  deploy-reporting-stack:
    name: Deploy Reporting Stack
    needs: deploy-application-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Reporting

      - name: Verify AWS Identity
        run: |
          set -e
          aws sts get-caller-identity

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Check SAM Version
        run: |
          sam --version

      - name: Validate Reporting SAM Template
        run: |
          set -e
          sam validate \
            --template-file infrastructure/cloudformation/reporting-stack.yml \
            --lint

          echo "Reporting template validation successful."

      - name: Verify Reporting Source Code
        run: |
          set -e
          test -f src/report/lambda_function.py
          test -f src/report/requirements.txt

          echo "Report Lambda source verified."

      - name: Build Reporting Artifacts
        run: |
          set -e
          sam build \
            --template-file infrastructure/cloudformation/reporting-stack.yml \
            --use-container

          echo "Reporting build successful."

      - name: Execute Reporting Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Reporting Stack"
          echo "=============================================="

          sam deploy \
            --stack-name cloudmart-dev-reporting-stack \
            --template-file .aws-sam/build/template.yaml \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides file://parameters.json \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Reporting stack deployed successfully."

      - name: Display Reporting Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-reporting-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

  # ==========================================================
  # 9. MONITORING STACK
  # ==========================================================
  deploy-monitoring-stack:
    name: Deploy Monitoring Stack
    needs: deploy-reporting-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Monitoring

      - name: Verify AWS Identity
        run: |
          set -e
          aws sts get-caller-identity

      - name: Validate Monitoring Template
        run: |
          set -e
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/monitoring-stack.yml \
            --region "$AWS_REGION" \
            >/dev/null

          echo "Monitoring template validation successful."

      - name: Execute Monitoring Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Monitoring Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/monitoring-stack.yml \
            --stack-name cloudmart-dev-monitoring-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json \
            --no-fail-on-empty-changeset

          echo "Monitoring stack deployed successfully."

      - name: Verify Monitoring Dependencies
        run: |
          set -e
          LOW_STOCK_TOPIC=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?contains(Name, 'LowStockTopicArn')].Value | [0]" \
            --output text)

          ORDER_TOPIC=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?contains(Name, 'OrderNotificationTopicArn')].Value | [0]" \
            --output text)

          if [ -z "$LOW_STOCK_TOPIC" ] || [ "$LOW_STOCK_TOPIC" = "None" ]
          then
            echo "Missing Low Stock SNS topic export."
            exit 1
          fi

          if [ -z "$ORDER_TOPIC" ] || [ "$ORDER_TOPIC" = "None" ]
          then
            echo "Missing Order Notification SNS topic export."
            exit 1
          fi

          echo "Low Stock SNS topic verified."
          echo "Order Notification SNS topic verified."

      - name: Display Monitoring Stack Outputs
        run: |
          echo "=============================================="
          echo "Monitoring Stack Outputs"
          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-monitoring-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

  # ==========================================================
  # 10. DASHBOARD STACK
  # ==========================================================
  deploy-dashboard-stack:
    name: Deploy Dashboard Stack
    needs: deploy-monitoring-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Product API Endpoint
        run: |
          set -e
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-application-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiUrl'].OutputValue | [0]" \
            --output text)

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]
          then
            echo "Product API URL was not found."
            exit 1
          fi

          echo "DASHBOARD_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Product API URL retrieved successfully."

      - name: Execute Dashboard Stack Deployment
        run: |
          set -e
          echo "=============================================="
          echo "Deploying CloudMart Dashboard Stack"
          echo "=============================================="

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/dashboard-stack.yml \
            --stack-name cloudmart-dev-dashboard-stack \
            --region "$AWS_REGION" \
            --parameter-overrides file://parameters.json DashboardApiUrl="${DASHBOARD_API_URL}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Dashboard stack deployed successfully."

      - name: Await Dashboard Stack Completion
        run: |
          set -e
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-dashboard-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Dashboard stack status: $STATUS"

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]
          then
            aws cloudformation wait stack-create-complete \
              --stack-name cloudmart-dev-dashboard-stack \
              --region "$AWS_REGION"
          elif [[ "$STATUS" == "UPDATE_IN_PROGRESS" ]] || \
               [[ "$STATUS" == "UPDATE_COMPLETE_CLEANUP_IN_PROGRESS" ]]
          then
            aws cloudformation wait stack-update-complete \
              --stack-name cloudmart-dev-dashboard-stack \
              --region "$AWS_REGION"
          fi

          echo "Dashboard stack is ready."

      - name: Display Dashboard Stack Outputs
        run: |
          echo "=============================================="
          echo "Dashboard Stack Outputs"
          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-dashboard-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

      - name: Display Dashboard Access Information
        run: |
          set -e
          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-dashboard-stack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardPublicIP'].OutputValue | [0]" \
            --output text)

          echo ""
          echo "=============================================="
          echo "CloudMart Dashboard"
          echo "=============================================="
          echo ""
          echo "Dashboard Public IP:"
          echo "$PUBLIC_IP"
          echo ""
          echo "Dashboard URL:"
          echo "http://$PUBLIC_IP"
          echo ""
          echo "=============================================="

      - name: Deployment Completion Summary
        run: |
          echo ""
          echo "================================================"
          echo "        CLOUDMART DEPLOYMENT COMPLETE"
          echo "================================================"
          echo ""
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "Stacks Deployed:"
          echo "  1. cloudmart-dev-network-stack"
          echo "  2. cloudmart-dev-data-stack"
          echo "  3. cloudmart-dev-iam-stack"
          echo "  4. cloudmart-dev-auth-stack"
          echo "  5. cloudmart-dev-event-driven-stack"
          echo "  6. cloudmart-dev-application-stack"
          echo "  7. cloudmart-dev-reporting-stack"
          echo "  8. cloudmart-dev-monitoring-stack"
          echo "  9. cloudmart-dev-dashboard-stack"
          echo ""
          echo "================================================"