name: CloudMart Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_STACK_PREFIX: cloudmart

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # VALIDATE
  # ==========================================================

  validate:

    name: Validate CloudFormation

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate templates
        run: |
          set -e

          for template in infrastructure/cloudformation/*.yml; do
            echo "Validating $template"
            aws cloudformation validate-template \
              --template-body "file://$template" \
              >/dev/null
          done

          echo "CloudFormation validation passed."


  # ==========================================================
  # NETWORK
  # ==========================================================

  network:

    name: Deploy Network

    needs: validate

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yml \
            --stack-name cloudmart-network \
            --region "$AWS_REGION"

          echo "Network deployed."


  # ==========================================================
  # DATABASE
  # ==========================================================

  database:

    name: Deploy Database

    needs: network

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Database
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/data.yml \
            --stack-name cloudmart-data \
            --region "$AWS_REGION"

          echo "Database stack deployed."

      - name: Wait for RDS
        run: |
          DB_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseIdentifier'].OutputValue" \
            --output text)

          if [ -n "$DB_ID" ] && [ "$DB_ID" != "None" ]; then
            aws rds wait db-instance-available \
              --db-instance-identifier "$DB_ID" \
              --region "$AWS_REGION"
          fi

          echo "RDS is available."


  # ==========================================================
  # IAM
  # ==========================================================

  iam:

    name: Deploy IAM

    needs: database

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/iam.yml \
            --stack-name cloudmart-iam \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM

          echo "IAM deployed."

      - name: Verify IAM exports
        run: |
          set -e

          for export in \
            CloudMart-LambdaExecutionRoleArn-dev \
            CloudMart-LambdaAuthorizerRoleArn-dev \
            CloudMart-DatabaseEndpoint \
            CloudMart-DatabaseSecretArn
          do
            VALUE=$(aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='$export'].Value | [0]" \
              --output text)

            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Missing export: $export"
              exit 1
            fi
          done

          echo "Required exports verified."


  # ==========================================================
  # AUTH
  # ==========================================================

  auth:

    name: Deploy Auth

    needs: iam

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate Auth
        run: |
          sam validate \
            --template-file infrastructure/cloudformation/auth-stack.yml

      - name: Build Auth
        run: |
          sam build \
            --template-file infrastructure/cloudformation/auth-stack.yml

      - name: Deploy Auth
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-auth \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Auth deployed."

      - name: Verify Authorizer
        run: |
          aws lambda get-function \
            --function-name CloudMart-Lambda-Authorizer-dev \
            --region "$AWS_REGION" \
            >/dev/null

          echo "Authorizer verified."


  # ==========================================================
  # PRODUCT API
  # ==========================================================

  application:

    name: Deploy Product API

    needs: auth

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate Product API
        run: |
          sam validate \
            --template-file infrastructure/cloudformation/application.yml

      - name: Build Product API
        run: |
          sam build \
            --template-file infrastructure/cloudformation/application.yml

      - name: Verify build
        run: |
          test -f .aws-sam/build/ProductApiFunction/lambda_function.py
          test -f .aws-sam/build/ProductApiFunction/schema.sql

          echo "Build verified."

      - name: Deploy Product API
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "Product API deployed."


  # ==========================================================
  # TEST API
  # ==========================================================

  test:

    name: Test Product API

    needs: application

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiUrl'].OutputValue | [0]" \
            --output text)

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "API URL not found."
            exit 1
          fi

          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

          echo "Product API: $API_URL"

      - name: Get auth token
        run: |
          TOKEN=$(aws ssm get-parameter \
            --name "/app/dev/auth/token" \
            --with-decryption \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "Auth token not found."
            exit 1
          fi

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Test unauthorized request
        run: |
          STATUS=$(curl \
            --silent \
            --output /tmp/unauthorized.json \
            --write-out "%{http_code}" \
            "$API_URL/product")

          echo "Unauthorized: HTTP $STATUS"

          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            cat /tmp/unauthorized.json
            exit 1
          fi

      - name: Test GET
        run: |
          STATUS=$(curl \
            --silent \
            --output /tmp/get.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$API_URL/product")

          echo "GET /product: HTTP $STATUS"
          cat /tmp/get.json

          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Test POST
        run: |
          STATUS=$(curl \
            --silent \
            --output /tmp/post.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{
              "name": "GitHub Test Product",
              "description": "Deployment test product",
              "price": 99.99,
              "category": "Test",
              "quantity_available": 10,
              "reorder_threshold": 2
            }' \
            "$API_URL/product")

          echo "POST /product: HTTP $STATUS"
          cat /tmp/post.json

          if [ "$STATUS" != "201" ]; then
            exit 1
          fi

      - name: Test GET after POST
        run: |
          STATUS=$(curl \
            --silent \
            --output /tmp/products.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$API_URL/product")

          echo "GET /product: HTTP $STATUS"
          cat /tmp/products.json

          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Test API Lambda
        run: |
          aws lambda get-function \
            --function-name CloudMart-Product-API-dev \
            --region "$AWS_REGION" \
            >/dev/null

          echo "Product Lambda verified."


  # ==========================================================
  # COMPLETE
  # ==========================================================

  complete:

    name: Deployment Complete

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Success
        run: |
          echo "CloudMart deployment successful."
          echo "Network:      OK"
          echo "Database:     OK"
          echo "IAM:          OK"
          echo "Auth:         OK"
          echo "Product API:  OK"
          echo "API Tests:    OK"