name: CloudMart Deploy Pipeline

on:
  push:
    branches:
      - main
      - changes
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  SAM_CLI_TELEMETRY: 0
  PARAM_FILE: infrastructure/config/parameters.json
  CF_DIR: infrastructure/cloudformation
  PARAMS: .github/scripts/stack-params.sh

permissions:
  id-token: write
  contents: read

# Secrets required (GitHub -> Settings -> Secrets and variables -> Actions):
#   AWS_ROLE_ARN, DB_PASSWORD, AUTH_TOKEN, LOW_STOCK_EMAIL, ORDER_NOTIFICATION_EMAIL
# Everything else comes from infrastructure/config/parameters.json.
# stack-params.sh passes each stack ONLY the parameters its template declares.

jobs:
  validate:
    name: Validate parameters and templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check parameters.json
        run: |
          set -e
          test -f "$PARAM_FILE" || { echo "$PARAM_FILE not found"; exit 1; }
          jq empty "$PARAM_FILE"
          EMPTY=$(jq -r '.[] | select(.ParameterValue == null or .ParameterValue == "") | .ParameterKey' "$PARAM_FILE")
          if [ -n "$EMPTY" ]; then echo "Empty values: $EMPTY"; exit 1; fi
          # secrets must never live in the JSON file
          if jq -e '.[] | select(.ParameterKey | test("Password|Token|Secret"; "i"))' "$PARAM_FILE" >/dev/null; then
            echo "parameters.json must not contain passwords/tokens - use GitHub secrets"; exit 1
          fi

      - name: Check required secrets exist
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          for v in DB_PASSWORD AUTH_TOKEN LOW_STOCK_EMAIL ORDER_NOTIFICATION_EMAIL; do
            if [ -z "${!v}" ]; then echo "GitHub secret $v is missing"; exit 1; fi
          done

      - name: Every template gets all of its parameters
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          for t in "$CF_DIR"/*.yml; do
            "$PARAMS" "$t" "$PARAM_FILE" \
              DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" \
              LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" \
              ReportS3BucketName=placeholder DashboardApiUrl=placeholder >/dev/null
            echo "params OK: $t"
          done

      - name: cfn-lint
        run: |
          pip install --quiet cfn-lint
          cfn-lint --non-zero-exit-code error "$CF_DIR"/*.yml

      - name: Validate with CloudFormation
        run: |
          set -e
          for t in "$CF_DIR"/*.yml; do
            aws cloudformation validate-template --template-body "file://$t" --region "$AWS_REGION" >/dev/null
            echo "valid: $t"
          done

  network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy network stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          mapfile -t P < <("$PARAMS" "$CF_DIR/network.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          aws cloudformation deploy \
            --template-file "$CF_DIR/network.yml" \
            --stack-name "cloudmart-${ENV_NAME}-network-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --no-fail-on-empty-changeset

  database:
    name: Deploy Database Stack
    runs-on: ubuntu-latest
    needs: network
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy data stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          mapfile -t P < <("$PARAMS" "$CF_DIR/data.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          aws cloudformation deploy \
            --template-file "$CF_DIR/data.yml" \
            --stack-name "cloudmart-${ENV_NAME}-data-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --no-fail-on-empty-changeset

      - name: Wait for RDS
        run: |
          set -e
          DB_ID="cloudmart-${ENV_NAME}-db"
          aws rds wait db-instance-available --db-instance-identifier "$DB_ID" --region "$AWS_REGION"
          echo "RDS $DB_ID is available."

  iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy iam stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          mapfile -t P < <("$PARAMS" "$CF_DIR/iam.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          aws cloudformation deploy \
            --template-file "$CF_DIR/iam.yml" \
            --stack-name "cloudmart-${ENV_NAME}-iam-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify exports
        run: |
          set -e
          for export in \
            cloudmart-${ENV_NAME}-lambda-execution-role-arn \
            cloudmart-${ENV_NAME}-lambda-authorizer-role-arn \
            cloudmart-${ENV_NAME}-report-lambda-role-arn \
            cloudmart-${ENV_NAME}-dashboard-ec2-role-arn \
            cloudmart-${ENV_NAME}-dashboard-ec2-profile-name \
            cloudmart-${ENV_NAME}-db-endpoint \
            cloudmart-${ENV_NAME}-db-port \
            cloudmart-${ENV_NAME}-db-name
          do
            VALUE=$(aws cloudformation list-exports --region "$AWS_REGION" \
              --query "Exports[?Name=='$export'].Value | [0]" --output text)
            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Missing export: $export"; exit 1
            fi
            echo "OK: $export"
          done

  auth:
    name: Deploy Authorizer and Init-Schema Stack
    runs-on: ubuntu-latest
    needs: iam
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: Validate, build and deploy auth stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          sam validate --template-file "$CF_DIR/auth-stack.yml" --region "$AWS_REGION"
          sam build --template-file "$CF_DIR/auth-stack.yml"
          test -f .aws-sam/build/LambdaAuthorizer/lambda_function.py
          test -f .aws-sam/build/InitSchemaLambda/lambda_function.py
          mapfile -t P < <("$PARAMS" "$CF_DIR/auth-stack.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-${ENV_NAME}-auth-stack" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "${P[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Initialise database schema
        run: |
          set -e
          FN="cloudmart-${ENV_NAME}-initschema"
          aws lambda invoke --function-name "$FN" --region "$AWS_REGION" \
            --cli-read-timeout 310 --payload '{}' --cli-binary-format raw-in-base64-out out.json >meta.json
          cat meta.json out.json
          if jq -e '.FunctionError' meta.json >/dev/null; then
            echo "Init-schema Lambda failed"; exit 1
          fi

  events:
    name: Deploy Event-Driven Stack
    runs-on: ubuntu-latest
    needs: auth
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy event-driven stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          mapfile -t P < <("$PARAMS" "$CF_DIR/event-driven-stack.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          aws cloudformation deploy \
            --template-file "$CF_DIR/event-driven-stack.yml" \
            --stack-name "cloudmart-${ENV_NAME}-event-driven-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --no-fail-on-empty-changeset

      - name: Verify exports
        run: |
          set -e
          for export in \
            cloudmart-${ENV_NAME}-low-stock-topic-arn \
            cloudmart-${ENV_NAME}-order-notification-topic-arn \
            cloudmart-${ENV_NAME}-event-bus-name
          do
            VALUE=$(aws cloudformation list-exports --region "$AWS_REGION" \
              --query "Exports[?Name=='$export'].Value | [0]" --output text)
            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Missing export: $export"; exit 1
            fi
            echo "OK: $export"
          done

  application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: events
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: Validate, build and deploy application stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          sam validate --template-file "$CF_DIR/application.yml" --region "$AWS_REGION"
          sam build --template-file "$CF_DIR/application.yml"
          for f in ProductApiFunction CustomerApiFunction OrderApiFunction; do test -f ".aws-sam/build/$f/lambda_function.py"; done
          mapfile -t P < <("$PARAMS" "$CF_DIR/application.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-${ENV_NAME}-application-stack" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "${P[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks --stack-name "cloudmart-${ENV_NAME}-application-stack" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs" --output table

  reporting:
    name: Deploy Reporting Stack
    runs-on: ubuntu-latest
    needs: application
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: Validate, build and deploy reporting stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          sam validate --template-file "$CF_DIR/reporting-stack.yml" --region "$AWS_REGION"
          sam build --template-file "$CF_DIR/reporting-stack.yml"
          test -f src/report/lambda_function.py
          mapfile -t P < <("$PARAMS" "$CF_DIR/reporting-stack.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-${ENV_NAME}-reporting-stack" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "${P[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: reporting
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy monitoring stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          mapfile -t P < <("$PARAMS" "$CF_DIR/monitoring-stack.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET")
          aws cloudformation deploy \
            --template-file "$CF_DIR/monitoring-stack.yml" \
            --stack-name "cloudmart-${ENV_NAME}-monitoring-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --no-fail-on-empty-changeset

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks --stack-name "cloudmart-${ENV_NAME}-monitoring-stack" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs" --output table

  dashboard:
    name: Deploy Dashboard Stack
    runs-on: ubuntu-latest
    needs: monitoring
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment context
        run: |
          set -e
          ENV_NAME=$(jq -r '.[] | select(.ParameterKey=="Environment") | .ParameterValue' "$PARAM_FILE")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=cloudmart-${ENV_NAME}-reports-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Deploy dashboard stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
          ORDER_NOTIFICATION_EMAIL: ${{ secrets.ORDER_NOTIFICATION_EMAIL }}
        run: |
          set -e
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-${ENV_NAME}-application-stack" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiUrl'].OutputValue | [0]" --output text)
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then echo "API URL not found"; exit 1; fi
          mapfile -t P < <("$PARAMS" "$CF_DIR/dashboard-stack.yml" "$PARAM_FILE" DBPassword="$DB_PASSWORD" AuthToken="$AUTH_TOKEN" LowStockEmail="$LOW_STOCK_EMAIL" OrderNotificationEmail="$ORDER_NOTIFICATION_EMAIL" ReportS3BucketName="$REPORT_BUCKET" DashboardApiUrl="$API_URL")
          aws cloudformation deploy \
            --template-file "$CF_DIR/dashboard-stack.yml" \
            --stack-name "cloudmart-${ENV_NAME}-dashboard-stack" \
            --region "$AWS_REGION" \
            --parameter-overrides "${P[@]}" \
            --no-fail-on-empty-changeset

      - name: Summary
        run: |
          IP=$(aws cloudformation describe-stacks --stack-name "cloudmart-${ENV_NAME}-dashboard-stack" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='DashboardPublicIP'].OutputValue | [0]" --output text)
          echo "Environment: $ENV_NAME  Region: $AWS_REGION"
          echo "Dashboard: http://$IP"