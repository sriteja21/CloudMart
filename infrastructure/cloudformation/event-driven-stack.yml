AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Event Driven Notification Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LowStockEmail:
    Type: String

  OrderNotificationEmail:
    Type: String

Resources:

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts
      DisplayName: !Sub CloudMart ${Environment} Low Stock Alerts
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockTopic
      Protocol: email
      Endpoint: !Ref LowStockEmail

  OrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-order-notifications
      DisplayName: !Sub CloudMart ${Environment} Order Notifications
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  OrderNotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderNotificationTopic
      Protocol: email
      Endpoint: !Ref OrderNotificationEmail

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

  LowStockEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-rule
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.product
        detail-type:
          - Low Stock Alert
      Targets:
        - Id: LowStockSNSTarget
          Arn: !Ref LowStockTopic
          InputTransformer:
            InputPathsMap:
              product_id: $.detail.product_id
              product_name: $.detail.product_name
              quantity_available: $.detail.quantity_available
              reorder_threshold: $.detail.reorder_threshold
            InputTemplate: |
              "CloudMart Low Stock Alert

              Product ID: <product_id>
              Product: <product_name>
              Available Quantity: <quantity_available>
              Reorder Threshold: <reorder_threshold>

              Please review the inventory and take the required action."

  OrderEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-order-rule
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - Order Confirmed
          - Order Shipped
          - Order Delivered
          - Order Cancelled
          - Order Failed
      Targets:
        - Id: OrderSNSTarget
          Arn: !Ref OrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              event_type: $.detail-type
              order_id: $.detail.order_id
              order_number: $.detail.order_number
              customer_id: $.detail.customer_id
              status: $.detail.status
              total_amount: $.detail.total_amount
              reason: $.detail.reason
            InputTemplate: |
              "CloudMart Order Notification

              Event: <event_type>
              Order ID: <order_id>
              Order Number: <order_number>
              Customer ID: <customer_id>
              Status: <status>
              Total Amount: ₹<total_amount>
              Reason: <reason>

              Thank you for shopping with CloudMart."

  LowStockSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref LowStockTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref LowStockTopic

  OrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref OrderNotificationTopic

Outputs:

  LowStockTopicArn:
    Description: Low stock SNS topic ARN
    Value: !Ref LowStockTopic
    Export:
      Name: !Sub CloudMart-${Environment}-LowStockTopicArn

  OrderNotificationTopicArn:
    Description: Order notification SNS topic ARN
    Value: !Ref OrderNotificationTopic
    Export:
      Name: !Sub CloudMart-${Environment}-OrderNotificationTopicArn

  CloudMartEventBusArn:
    Description: CloudMart EventBridge event bus ARN
    Value: !GetAtt CloudMartEventBus.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-EventBusArn

  CloudMartEventBusName:
    Description: CloudMart EventBridge event bus name
    Value: !Ref CloudMartEventBus
    Export:
      Name: !Sub CloudMart-${Environment}-EventBusName
