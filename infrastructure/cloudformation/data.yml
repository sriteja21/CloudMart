AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Database Stack 
# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'

  DBUsername:
    Type: String
    Default: cloudmartadmin
    Description: RDS MySQL master username
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS MySQL master password
    MinLength: 8
    MaxLength: 41

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class for development

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB for development
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # RDS SUBNET GROUP
  # ========================================================

  CloudMartDBSubnetGroup:

    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: CloudMart RDS private subnet group

      SubnetIds:
        - Fn::ImportValue: CloudMart-Private-Subnet-ID
        - Fn::ImportValue: CloudMart-Private-Subnet-2-ID

      Tags:

        - Key: Name
          Value: CloudMart-RDS-SubnetGroup

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS MYSQL
  # ========================================================

  CloudMartDatabase:

    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      Engine: mysql

      EngineVersion: '8.0.46'

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername

      MasterUserPassword: !Ref DBPassword

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3

      DBSubnetGroupName:
        Ref: CloudMartDBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue: CloudMart-RDS-SG-ID

      PubliclyAccessible: false

      BackupRetentionPeriod: 0

      CopyTagsToSnapshot: true

      StorageEncrypted: true

      DeletionProtection: false

      Tags:

        - Key: Name
          Value: CloudMart-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev

        - Key: CostProfile
          Value: FreeTier-Development


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  # --------------------------------------------------------
  # DATABASE IDENTIFIER
  # --------------------------------------------------------

  DatabaseIdentifier:

    Description: CloudMart RDS database identifier

    Value: !Ref CloudMartDatabase

    Export:
      Name: CloudMart-DatabaseIdentifier


  # --------------------------------------------------------
  # DATABASE ENDPOINT
  # --------------------------------------------------------

  DatabaseEndpoint:

    Description: CloudMart RDS endpoint

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Address

    Export:
      Name: CloudMart-DatabaseEndpoint


  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePort:

    Description: CloudMart RDS MySQL port

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Port

    Export:
      Name: CloudMart-DatabasePort


  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseName:

    Description: CloudMart database name

    Value: !Ref DBName

    Export:
      Name: CloudMart-DatabaseName


  # --------------------------------------------------------
  # DATABASE SUBNET GROUP
  # --------------------------------------------------------

  DatabaseSubnetGroup:

    Description: CloudMart RDS DB subnet group

    Value:
      Ref: CloudMartDBSubnetGroup

    Export:
      Name: CloudMart-DatabaseSubnetGroup