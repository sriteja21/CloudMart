AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Database Stack.
  Creates Amazon RDS MySQL in the private subnet
  created by the CloudMart Network Stack.


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  # --------------------------------------------------------
  # Database name
  # --------------------------------------------------------

  DBName:
    Type: String
    Default: cloudmart
    Description: Name of the CloudMart database

    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'


  # --------------------------------------------------------
  # RDS instance class
  # --------------------------------------------------------

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class


  # --------------------------------------------------------
  # Database storage
  # --------------------------------------------------------

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB

    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # DATABASE SECRET
  # ========================================================

  CloudMartDatabaseSecret:

    Type: AWS::SecretsManager::Secret

    Properties:

      Name: /cloudmart/dev/database

      Description: CloudMart RDS MySQL database credentials

      GenerateSecretString:

        SecretStringTemplate: '{"username":"cloudmartadmin"}'

        GenerateStringKey: password

        PasswordLength: 32

        ExcludeCharacters: '"@/\'

      Tags:

        - Key: Name
          Value: CloudMart-Database-Secret

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS SUBNET GROUP
  # ========================================================

  CloudMartDBSubnetGroup:

    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: >
        Private subnet group for CloudMart RDS MySQL

      SubnetIds:

        - Fn::ImportValue: CloudMart-Private-Subnet-ID

      Tags:

        - Key: Name
          Value: CloudMart-RDS-SubnetGroup

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS MYSQL DATABASE
  #
  # RDS SECURITY GROUP IS ALREADY CREATED BY NETWORK STACK.
  # ========================================================

  CloudMartDatabase:

    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot

    UpdateReplacePolicy: Snapshot

    Properties:

      # ----------------------------------------------------
      # Database engine
      # ----------------------------------------------------

      Engine: mysql

      EngineVersion: '8.0.46'


      # ----------------------------------------------------
      # Database name
      # ----------------------------------------------------

      DBName: !Ref DBName


      # ----------------------------------------------------
      # Database credentials
      # ----------------------------------------------------

      MasterUsername:
        Fn::Sub:
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'
          - SecretArn: !Ref CloudMartDatabaseSecret

      MasterUserPassword:
        Fn::Sub:
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
          - SecretArn: !Ref CloudMartDatabaseSecret


      # ----------------------------------------------------
      # Instance configuration
      # ----------------------------------------------------

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3


      # ----------------------------------------------------
      # Network configuration
      # ----------------------------------------------------

      DBSubnetGroupName:
        Ref: CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue: CloudMart-RDS-SG-ID

      PubliclyAccessible: false


      # ----------------------------------------------------
      # Backup configuration
      # ----------------------------------------------------

      BackupRetentionPeriod: 7

      CopyTagsToSnapshot: true


      # ----------------------------------------------------
      # Encryption
      # ----------------------------------------------------

      StorageEncrypted: true


      # ----------------------------------------------------
      # Deletion protection
      # ----------------------------------------------------

      DeletionProtection: false


      # ----------------------------------------------------
      # Tags
      # ----------------------------------------------------

      Tags:

        - Key: Name
          Value: CloudMart-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # --------------------------------------------------------
  # RDS Database Identifier
  # --------------------------------------------------------

  DatabaseIdentifier:

    Description: CloudMart RDS database identifier

    Value:
      Ref: CloudMartDatabase

    Export:
      Name: CloudMart-DatabaseIdentifier


  # --------------------------------------------------------
  # RDS Endpoint
  # --------------------------------------------------------

  DatabaseEndpoint:

    Description: CloudMart RDS endpoint

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Address

    Export:
      Name: CloudMart-DatabaseEndpoint


  # --------------------------------------------------------
  # RDS Port
  # --------------------------------------------------------

  DatabasePort:

    Description: CloudMart RDS MySQL port

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Port

    Export:
      Name: CloudMart-DatabasePort


  # --------------------------------------------------------
  # Database Name
  # --------------------------------------------------------

  DatabaseName:

    Description: CloudMart database name

    Value: !Ref DBName

    Export:
      Name: CloudMart-DatabaseName


  # --------------------------------------------------------
  # Database Secret ARN
  # --------------------------------------------------------

  DatabaseSecretArn:

    Description: ARN of the CloudMart database secret

    Value:
      Ref: CloudMartDatabaseSecret

    Export:
      Name: CloudMart-DatabaseSecretArn