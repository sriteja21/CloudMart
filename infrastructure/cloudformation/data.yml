AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Database Stack


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  # --------------------------------------------------------
  # Database name
  # --------------------------------------------------------

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'


  # --------------------------------------------------------
  # RDS instance class
  # --------------------------------------------------------

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class


  # --------------------------------------------------------
  # Database storage
  # --------------------------------------------------------

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # DATABASE SECRET
  # ========================================================

  CloudMartDatabaseSecret:

    Type: AWS::SecretsManager::Secret

    Properties:

      Description: "CloudMart RDS MySQL database credentials"

      GenerateSecretString:

        SecretStringTemplate: '{"username":"cloudmartadmin"}'

        GenerateStringKey: password

        PasswordLength: 32

        ExcludeCharacters: '"@/\'

      Tags:

        - Key: Name
          Value: CloudMart-Database-Secret

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS MYSQL DATABASE
  # ========================================================

  CloudMartDatabase:

    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot

    UpdateReplacePolicy: Snapshot

    Properties:

      # ----------------------------------------------------
      # Database engine
      # ----------------------------------------------------

      Engine: mysql

      EngineVersion: '8.0.46'


      # ----------------------------------------------------
      # Database name
      # ----------------------------------------------------

      DBName: !Ref DBName


      # ----------------------------------------------------
      # Database credentials
      # ----------------------------------------------------

      MasterUsername:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      MasterUserPassword:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      # ----------------------------------------------------
      # Instance configuration
      # ----------------------------------------------------

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3


      # ----------------------------------------------------
      # EXISTING RDS SUBNET GROUP
      # ----------------------------------------------------

      DBSubnetGroupName: cloudmart-rds-subnetgroup


      # ----------------------------------------------------
      # EXISTING RDS SECURITY GROUP
      # ----------------------------------------------------

      VPCSecurityGroups:

        - Fn::ImportValue: CloudMart-RDS-SG-ID


      # ----------------------------------------------------
      # RDS NETWORK ACCESS
      # ----------------------------------------------------

      PubliclyAccessible: false


      # ----------------------------------------------------
      # BACKUP
      # ----------------------------------------------------

      BackupRetentionPeriod: 7

      CopyTagsToSnapshot: true


      # ----------------------------------------------------
      # ENCRYPTION
      # ----------------------------------------------------

      StorageEncrypted: true


      # ----------------------------------------------------
      # DELETION PROTECTION
      # ----------------------------------------------------

      DeletionProtection: false


      # ----------------------------------------------------
      # TAGS
      # ----------------------------------------------------

      Tags:

        - Key: Name
          Value: CloudMart-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  # --------------------------------------------------------
  # DATABASE IDENTIFIER
  # --------------------------------------------------------

  DatabaseIdentifier:

    Description: CloudMart RDS database identifier

    Value: !Ref CloudMartDatabase

    Export:
      Name: CloudMart-DatabaseIdentifier


  # --------------------------------------------------------
  # DATABASE ENDPOINT
  # --------------------------------------------------------

  DatabaseEndpoint:

    Description: CloudMart RDS endpoint

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Address

    Export:
      Name: CloudMart-DatabaseEndpoint


  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePort:

    Description: CloudMart RDS MySQL port

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Port

    Export:
      Name: CloudMart-DatabasePort


  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseName:

    Description: CloudMart database name

    Value: !Ref DBName

    Export:
      Name: CloudMart-DatabaseName


  # --------------------------------------------------------
  # DATABASE SECRET ARN
  # --------------------------------------------------------

  DatabaseSecretArn:

    Description: CloudMart database secret ARN

    Value: !Ref CloudMartDatabaseSecret

    Export:
      Name: CloudMart-DatabaseSecretArn