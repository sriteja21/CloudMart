AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Database Stack - Free Tier Development Configuration


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'


  # --------------------------------------------------------
  # RDS INSTANCE CLASS
  #
  # Free Tier / Development assumption
  # --------------------------------------------------------

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class for development


  # --------------------------------------------------------
  # DATABASE STORAGE
  #
  # 20 GB development configuration
  # --------------------------------------------------------

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB for development
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # DATABASE SECRET
  # ========================================================

  CloudMartDatabaseSecret:

    Type: AWS::SecretsManager::Secret

    Properties:

      Description: "CloudMart RDS MySQL database credentials"

      GenerateSecretString:

        SecretStringTemplate: '{"username":"cloudmartadmin"}'

        GenerateStringKey: password

        PasswordLength: 32

        ExcludeCharacters: '"@/\'

      Tags:

        - Key: Name
          Value: CloudMart-Database-Secret

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS DB SUBNET GROUP
  #
  # Created and managed by CloudFormation.
  #
  # Uses the two private subnets created by network.yml.
  # The two subnets are in different Availability Zones.
  # ========================================================

  CloudMartDBSubnetGroup:

    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: "CloudMart RDS private subnet group"

      SubnetIds:

        - Fn::ImportValue: CloudMart-Private-Subnet-ID

        - Fn::ImportValue: CloudMart-Private-Subnet-2-ID

      Tags:

        - Key: Name
          Value: CloudMart-RDS-SubnetGroup

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS MYSQL DATABASE
  # ========================================================

  CloudMartDatabase:

    Type: AWS::RDS::DBInstance

    # ------------------------------------------------------
    # CloudFormation keeps a final snapshot if the
    # database resource is deleted.
    # ------------------------------------------------------

    DeletionPolicy: Snapshot

    UpdateReplacePolicy: Snapshot

    Properties:


      # ====================================================
      # DATABASE ENGINE
      # ====================================================

      Engine: mysql

      EngineVersion: '8.0.46'


      # ====================================================
      # DATABASE NAME
      # ====================================================

      DBName: !Ref DBName


      # ====================================================
      # DATABASE CREDENTIALS
      # ====================================================

      MasterUsername:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      MasterUserPassword:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      # ====================================================
      # INSTANCE CONFIGURATION
      # ====================================================

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3


      # ====================================================
      # CLOUDFORMATION-MANAGED DB SUBNET GROUP
      # ====================================================

      DBSubnetGroupName:

        Ref: CloudMartDBSubnetGroup


      # ====================================================
      # RDS SECURITY GROUP
      #
      # Imported from network.yml
      # ====================================================

      VPCSecurityGroups:

        - Fn::ImportValue: CloudMart-RDS-SG-ID


      # ====================================================
      # PRIVATE DATABASE
      # ====================================================

      PubliclyAccessible: false


      # ====================================================
      # BACKUP CONFIGURATION
      #
      # Free Tier / Development assumption:
      # automated backups disabled.
      # ====================================================

      BackupRetentionPeriod: 0

      CopyTagsToSnapshot: true


      # ====================================================
      # STORAGE ENCRYPTION
      # ====================================================

      StorageEncrypted: true


      # ====================================================
      # DELETION PROTECTION
      #
      # Disabled for development.
      # ====================================================

      DeletionProtection: false


      # ====================================================
      # TAGS
      # ====================================================

      Tags:

        - Key: Name
          Value: CloudMart-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev

        - Key: CostProfile
          Value: FreeTier-Development


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # --------------------------------------------------------
  # DATABASE IDENTIFIER
  # --------------------------------------------------------

  DatabaseIdentifier:

    Description: CloudMart RDS database identifier

    Value: !Ref CloudMartDatabase

    Export:
      Name: CloudMart-DatabaseIdentifier


  # --------------------------------------------------------
  # DATABASE ENDPOINT
  # --------------------------------------------------------

  DatabaseEndpoint:

    Description: CloudMart RDS endpoint

    Value:

      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Address

    Export:
      Name: CloudMart-DatabaseEndpoint


  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePort:

    Description: CloudMart RDS MySQL port

    Value:

      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Port

    Export:
      Name: CloudMart-DatabasePort


  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseName:

    Description: CloudMart database name

    Value: !Ref DBName

    Export:
      Name: CloudMart-DatabaseName


  # --------------------------------------------------------
  # DATABASE SECRET ARN
  # --------------------------------------------------------

  DatabaseSecretArn:

    Description: CloudMart database secret ARN

    Value: !Ref CloudMartDatabaseSecret

    Export:
      Name: CloudMart-DatabaseSecretArn


  # --------------------------------------------------------
  # DATABASE SUBNET GROUP
  # --------------------------------------------------------

  DatabaseSubnetGroup:

    Description: CloudMart RDS DB subnet group

    Value:
      Ref: CloudMartDBSubnetGroup

    Export:
      Name: CloudMart-DatabaseSubnetGroup