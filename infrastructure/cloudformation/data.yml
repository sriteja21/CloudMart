AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Database Stack - Free Tier Development Configuration


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'


  # --------------------------------------------------------
  # RDS INSTANCE CLASS
  #
  # Free Tier / Development assumption
  # --------------------------------------------------------

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class for development


  # --------------------------------------------------------
  # DATABASE STORAGE
  #
  # 20 GB keeps the development database small.
  # --------------------------------------------------------

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB for development
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # DATABASE SECRET
  # ========================================================

  CloudMartDatabaseSecret:

    Type: AWS::SecretsManager::Secret

    Properties:

      Description: "CloudMart RDS MySQL database credentials"

      GenerateSecretString:

        SecretStringTemplate: '{"username":"cloudmartadmin"}'

        GenerateStringKey: password

        PasswordLength: 32

        ExcludeCharacters: '"@/\'

      Tags:

        - Key: Name
          Value: CloudMart-Database-Secret

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  # ========================================================
  # RDS MYSQL DATABASE
  # ========================================================

  CloudMartDatabase:

    Type: AWS::RDS::DBInstance

    # ------------------------------------------------------
    # If CloudFormation deletes this resource, keep a
    # final snapshot.
    # ------------------------------------------------------

    DeletionPolicy: Snapshot

    UpdateReplacePolicy: Snapshot

    Properties:


      # ====================================================
      # DATABASE ENGINE
      # ====================================================

      Engine: mysql

      EngineVersion: '8.0.46'


      # ====================================================
      # DATABASE NAME
      # ====================================================

      DBName: !Ref DBName


      # ====================================================
      # DATABASE CREDENTIALS
      # ====================================================

      MasterUsername:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      MasterUserPassword:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'

          - SecretArn: !Ref CloudMartDatabaseSecret


      # ====================================================
      # INSTANCE CONFIGURATION
      # ====================================================

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3


      # ====================================================
      # EXISTING DB SUBNET GROUP
      #
      # This subnet group was created manually.
      #
      # Name:
      # cloudmart-rds-subnetgroup
      # ====================================================

      DBSubnetGroupName: cloudmart-rds-subnetgroup


      # ====================================================
      # EXISTING RDS SECURITY GROUP
      #
      # Created by network.yml
      # ====================================================

      VPCSecurityGroups:

        - Fn::ImportValue: CloudMart-RDS-SG-ID


      # ====================================================
      # PRIVATE DATABASE
      # ====================================================

      PubliclyAccessible: false


      # ====================================================
      # BACKUP CONFIGURATION
      #
      # FREE-TIER DEVELOPMENT ASSUMPTION
      #
      # Automated backup retention is disabled because
      # the current AWS account has a Free Tier limitation
      # on the allowed backup retention period.
      # ====================================================

      BackupRetentionPeriod: 0

      CopyTagsToSnapshot: true


      # ====================================================
      # STORAGE ENCRYPTION
      # ====================================================

      StorageEncrypted: true


      # ====================================================
      # DELETION PROTECTION
      #
      # Disabled for development so the stack can be
      # deleted/recreated easily.
      # ====================================================

      DeletionProtection: false


      # ====================================================
      # TAGS
      # ====================================================

      Tags:

        - Key: Name
          Value: CloudMart-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev

        - Key: CostProfile
          Value: FreeTier-Development


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # --------------------------------------------------------
  # DATABASE IDENTIFIER
  # --------------------------------------------------------

  DatabaseIdentifier:

    Description: CloudMart RDS database identifier

    Value: !Ref CloudMartDatabase

    Export:
      Name: CloudMart-DatabaseIdentifier


  # --------------------------------------------------------
  # DATABASE ENDPOINT
  # --------------------------------------------------------

  DatabaseEndpoint:

    Description: CloudMart RDS endpoint

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Address

    Export:
      Name: CloudMart-DatabaseEndpoint


  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePort:

    Description: CloudMart RDS MySQL port

    Value:
      Fn::GetAtt:
        - CloudMartDatabase
        - Endpoint.Port

    Export:
      Name: CloudMart-DatabasePort


  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseName:

    Description: CloudMart database name

    Value: !Ref DBName

    Export:
      Name: CloudMart-DatabaseName


  # --------------------------------------------------------
  # DATABASE SECRET ARN
  # --------------------------------------------------------

  DatabaseSecretArn:

    Description: CloudMart database secret ARN

    Value: !Ref CloudMartDatabaseSecret

    Export:
      Name: CloudMart-DatabaseSecretArn