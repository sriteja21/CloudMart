AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CloudMart Database Stack 

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    Description: Environment name (e.g., dev, staging, prod)

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'

  DBUsername:
    Type: String
    Default: cloudmartadmin
    Description: RDS MySQL master username
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS MySQL master password
    MinLength: 8
    MaxLength: 41

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class for development

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB for development
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # RDS SUBNET GROUP
  # ========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart RDS private subnet group
      SubnetIds:
        - Fn::ImportValue: CloudMart-Private-Subnet-ID
        - Fn::ImportValue: CloudMart-Private-Subnet-2-ID
      Tags:
        - Key: Name
          Value: CloudMart-RDS-SubnetGroup
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # RDS MYSQL
  # ========================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.0.46'
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: CloudMart-RDS-SG-ID
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      CopyTagsToSnapshot: true
      StorageEncrypted: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: CloudMart-RDS
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # SSM PARAMETERS
  # ========================================================

  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app/${Environment}/database/host'
      Type: String
      Value: !GetAtt CloudMartDatabase.Endpoint.Address

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app/${Environment}/database/port'
      Type: String
      Value: !GetAtt CloudMartDatabase.Endpoint.Port

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app/${Environment}/database/name'
      Type: String
      Value: !Ref DBName

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app/${Environment}/database/username'
      Type: String
      Value: !Ref DBUsername

  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app/${Environment}/database/password'
      Type: String
      Value: !Ref DBPassword


  # ========================================================
  # LAMBDA SECURITY GROUP
  # ========================================================

  InitSchemaLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Init Schema Lambda
      VpcId:
        Fn::ImportValue: CloudMart-VPC-ID
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CloudMart-InitSchema-Lambda-SG
        - Key: Project
          Value: CloudMart


  # ========================================================
  # INIT SCHEMA SAM FUNCTION
  # ========================================================

  InitSchemaLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub CloudMart-InitSchema-${Environment}
      CodeUri: ../../src/init-schema
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref InitSchemaLambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-2-ID
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*"
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Tags:
        Project: CloudMart


  # ========================================================
  # CUSTOM RESOURCE TO TRIGGER LAMBDA ON DEPLOY
  # ========================================================

  ApplySchemaCustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: 
      - CloudMartDatabase
      - DBHostParameter
      - DBPortParameter
      - DBNameParameter
      - DBUsernameParameter
      - DBPasswordParameter
    Properties:
      ServiceToken: !GetAtt InitSchemaLambda.Arn


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  DatabaseEndpoint:
    Description: CloudMart RDS endpoint
    Value: !GetAtt CloudMartDatabase.Endpoint.Address
    Export:
      Name: CloudMart-DatabaseEndpoint

  InitSchemaLambdaArn:
    Description: ARN of the Schema Initialization Lambda
    Value: !GetAtt InitSchemaLambda.Arn
    Export:
      Name: CloudMart-InitSchemaLambdaArn