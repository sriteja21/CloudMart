AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Database Stack 

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment (e.g., dev, test, prod)

  DBName:
    Type: String
    Description: CloudMart database name
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'

  DBUsername:
    Type: String
    Description: RDS MySQL master username
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS MySQL master password
    MinLength: 8
    MaxLength: 41

  DBInstanceClass:
    Type: String
    Description: RDS MySQL instance class for deployment

  DBAllocatedStorage:
    Type: Number
    Description: RDS allocated storage in GB
    MinValue: 20


# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # RDS SUBNET GROUP
  # ========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub cloudmart-${Environment}-db-subnet-group
      DBSubnetGroupDescription: CloudMart RDS private subnet group
      SubnetIds:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-1-id
        - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-2-id
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # RDS MYSQL
  # ========================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub cloudmart-${Environment}-db
      Engine: mysql
      EngineVersion: '8.0.46'
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-rds-sg-id
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      CopyTagsToSnapshot: true
      StorageEncrypted: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-db
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  DatabaseIdentifier:
    Description: CloudMart RDS database identifier
    Value: !Ref CloudMartDatabase
    Export:
      Name: !Sub cloudmart-${Environment}-db-instance-id

  DatabaseEndpoint:
    Description: CloudMart RDS endpoint
    Value: !GetAtt CloudMartDatabase.Endpoint.Address
    Export:
      Name: !Sub cloudmart-${Environment}-db-endpoint

  DatabasePort:
    Description: CloudMart RDS MySQL port
    Value: !GetAtt CloudMartDatabase.Endpoint.Port
    Export:
      Name: !Sub cloudmart-${Environment}-db-port

  DatabaseName:
    Description: CloudMart database name
    Value: !Ref DBName
    Export:
      Name: !Sub cloudmart-${Environment}-db-name

  DatabaseSubnetGroup:
    Description: CloudMart RDS DB subnet group
    Value: !Ref CloudMartDBSubnetGroup
    Export:
      Name: !Sub cloudmart-${Environment}-db-subnet-group-name