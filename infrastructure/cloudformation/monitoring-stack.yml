AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Enhanced Monitoring Stack.
  Creates CloudWatch dashboard, application metrics,
  CloudWatch alarms and monitoring SNS notifications.

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Description: CloudMart deployment environment

Resources:

  # ==========================================================
  # MONITORING SNS TOPIC
  # ==========================================================

  MonitoringAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-monitoring-alarms
      DisplayName: !Sub CloudMart ${Environment} Monitoring Alarms
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: Monitoring

  # ==========================================================
  # CLOUDWATCH OPERATIONS DASHBOARD
  # ==========================================================

  CloudMartOperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub cloudmart-operations-${Environment}
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "text",
                  "x": 0, "y": 0, "width": 24, "height": 2,
                  "properties": {
                    "markdown": "# CloudMart Operations Dashboard — ${Environment}"
                  }
                },

                {
                  "type": "metric",
                  "x": 0, "y": 2, "width": 8, "height": 6,
                  "properties": {
                    "title": "API Gateway — Request Count",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["AWS/ApiGateway", "Count", "ApiName", "cloudmart-${Environment}-product-customer-order-api", "Stage", "${Environment}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 8, "y": 2, "width": 8, "height": 6,
                  "properties": {
                    "title": "API Gateway — Errors (4XX & 5XX)",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["AWS/ApiGateway", "4XXError", "ApiName", "cloudmart-${Environment}-product-customer-order-api", "Stage", "${Environment}"],
                      ["AWS/ApiGateway", "5XXError", "ApiName", "cloudmart-${Environment}-product-customer-order-api", "Stage", "${Environment}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 16, "y": 2, "width": 8, "height": 6,
                  "properties": {
                    "title": "API Gateway — Latency (p95 / p99)",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/ApiGateway", "Latency", "ApiName", "cloudmart-${Environment}-product-customer-order-api", "Stage", "${Environment}", { "stat": "p95" }],
                      ["AWS/ApiGateway", "IntegrationLatency", "ApiName", "cloudmart-${Environment}-product-customer-order-api", "Stage", "${Environment}", { "stat": "p95" }]
                    ]
                  }
                },

                {
                  "type": "metric",
                  "x": 0, "y": 8, "width": 6, "height": 6,
                  "properties": {
                    "title": "Lambda — Product API",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-product-api"],
                      ["AWS/Lambda", "Errors", "FunctionName", "cloudmart-${Environment}-product-api"],
                      ["AWS/Lambda", "Throttles", "FunctionName", "cloudmart-${Environment}-product-api"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 6, "y": 8, "width": 6, "height": 6,
                  "properties": {
                    "title": "Lambda — Order API",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-order-api"],
                      ["AWS/Lambda", "Errors", "FunctionName", "cloudmart-${Environment}-order-api"],
                      ["AWS/Lambda", "Throttles", "FunctionName", "cloudmart-${Environment}-order-api"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 8, "width": 6, "height": 6,
                  "properties": {
                    "title": "Lambda — Authorizer",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-lambda-authorizer"],
                      ["AWS/Lambda", "Errors", "FunctionName", "cloudmart-${Environment}-lambda-authorizer"],
                      ["AWS/Lambda", "Throttles", "FunctionName", "cloudmart-${Environment}-lambda-authorizer"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 18, "y": 8, "width": 6, "height": 6,
                  "properties": {
                    "title": "Lambda — Report Generator",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-report-lambda"],
                      ["AWS/Lambda", "Errors", "FunctionName", "cloudmart-${Environment}-report-lambda"],
                      ["AWS/Lambda", "Throttles", "FunctionName", "cloudmart-${Environment}-report-lambda"]
                    ]
                  }
                },

                {
                  "type": "metric",
                  "x": 0, "y": 14, "width": 8, "height": 6,
                  "properties": {
                    "title": "RDS — CPU & Connections",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"],
                      ["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 8, "y": 14, "width": 8, "height": 6,
                  "properties": {
                    "title": "RDS — Free Memory & Storage",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"],
                      ["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 16, "y": 14, "width": 8, "height": 6,
                  "properties": {
                    "title": "RDS — Read/Write IOPS",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"],
                      ["AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${cloudmartDbInstanceId}"]
                    ]
                  }
                },

                {
                  "type": "metric",
                  "x": 0, "y": 20, "width": 6, "height": 6,
                  "properties": {
                    "title": "Business — Orders Placed",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["CloudMart/Operations", "OrdersPlaced", "Environment", "${Environment}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 6, "y": 20, "width": 6, "height": 6,
                  "properties": {
                    "title": "Business — Orders Cancelled",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["CloudMart/Operations", "OrdersCancelled", "Environment", "${Environment}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 20, "width": 6, "height": 6,
                  "properties": {
                    "title": "Business — Orders Failed",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["CloudMart/Operations", "OrdersFailed", "Environment", "${Environment}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 18, "y": 20, "width": 6, "height": 6,
                  "properties": {
                    "title": "Business — Low Stock Events",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Sum",
                    "metrics": [
                      ["CloudMart/Operations", "LowStockEvents", "Environment", "${Environment}"]
                    ]
                  }
                }
              ]
            }
          - cloudmartDbInstanceId:
              Fn::ImportValue: !Sub cloudmart-${Environment}-db-instance-id

  # ==========================================================
  # BUSINESS METRIC ALARMS
  # ==========================================================

  OrdersCancelledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-orders-cancelled
      AlarmDescription: Alarm when 5 or more orders are cancelled within a 5-minute period.
      Namespace: CloudMart/Operations
      MetricName: OrdersCancelled
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-orders-failed
      AlarmDescription: Alarm when one or more orders fail.
      Namespace: CloudMart/Operations
      MetricName: OrdersFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-low-stock-events
      AlarmDescription: Alarm when one or more low stock events occur.
      Namespace: CloudMart/Operations
      MetricName: LowStockEvents
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # DATABASE ALARMS (AUTOMATIC CROSS-STACK DB INSTANCE ID)
  # ==========================================================

  RdsHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-high-cpu
      AlarmDescription: Alarm when RDS CPU utilization exceeds 80%.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value:
            Fn::ImportValue: !Sub cloudmart-${Environment}-db-instance-id
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  RdsLowStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-low-storage
      AlarmDescription: Alarm when RDS free storage falls below 5GB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value:
            Fn::ImportValue: !Sub cloudmart-${Environment}-db-instance-id
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5368709120  # 5 GB in bytes
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # LAMBDA ALARMS
  # ==========================================================

  OrderLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-order-lambda-throttles
      AlarmDescription: Alarm when Order Lambda is throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-order-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  ProductLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-product-lambda-errors
      AlarmDescription: Alarm when Product Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-product-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  OrderLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-order-lambda-errors
      AlarmDescription: Alarm when Order Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-order-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  AuthorizerLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-authorizer-lambda-errors
      AlarmDescription: Alarm when Lambda Authorizer has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-lambda-authorizer
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  ReportLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-report-lambda-errors
      AlarmDescription: Alarm when Report Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-report-lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # API GATEWAY ALARMS
  # ==========================================================

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-api-4xx
      AlarmDescription: Alarm when API Gateway returns one or more 4XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub cloudmart-${Environment}-product-customer-order-api
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-api-5xx
      AlarmDescription: Alarm when API Gateway returns one or more 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub cloudmart-${Environment}-product-customer-order-api
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

Outputs:
  OperationsDashboardName:
    Value: !Sub cloudmart-operations-${Environment}
    Export:
      Name: !Sub cloudmart-${Environment}-operations-dashboard-name

  MonitoringAlarmTopicArn:
    Value: !Ref MonitoringAlarmTopic
    Export:
      Name: !Sub cloudmart-${Environment}-monitoring-alarm-topic-arn

  OrdersCancelledAlarmName:
    Value: !Ref OrdersCancelledAlarm
    Export:
      Name: !Sub cloudmart-${Environment}-orders-cancelled-alarm-name