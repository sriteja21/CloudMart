AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Enhanced Monitoring Stack.
  Creates CloudWatch dashboard, application metrics,
  CloudWatch alarms and monitoring SNS notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment

  DBInstanceIdentifier:
    Type: String
    Default: cloudmart-db-dev
    Description: RDS Instance Identifier for MySQL database monitoring

Resources:

  # ==========================================================
  # MONITORING SNS TOPIC
  # ==========================================================

  MonitoringAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub CloudMart-${Environment}-Monitoring-Alarms
      DisplayName: !Sub CloudMart ${Environment} Monitoring Alarms
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: Monitoring

  # ==========================================================
  # CLOUDWATCH OPERATIONS DASHBOARD
  # ==========================================================

  CloudMartOperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub cloudmart-operations-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# CloudMart Operations Dashboard — ${Environment}"
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway — Request Count",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "CloudMart-Product-Customer-Order-API-${Environment}", "Stage", "${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway — Errors (4XX & 5XX)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/ApiGateway", "4XXError", "ApiName", "CloudMart-Product-Customer-Order-API-${Environment}", "Stage", "${Environment}"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "CloudMart-Product-Customer-Order-API-${Environment}", "Stage", "${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway — Latency (p95 / p99)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "CloudMart-Product-Customer-Order-API-${Environment}", "Stage", "${Environment}", { "stat": "p95" }],
                  ["AWS/ApiGateway", "IntegrationLatency", "ApiName", "CloudMart-Product-Customer-Order-API-${Environment}", "Stage", "${Environment}", { "stat": "p95" }]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 8, "width": 6, "height": 6,
              "properties": {
                "title": "Lambda — Product API",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "CloudMart-Product-API-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "CloudMart-Product-API-${Environment}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "CloudMart-Product-API-${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 6, "y": 8, "width": 6, "height": 6,
              "properties": {
                "title": "Lambda — Order API",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "CloudMart-Order-API-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "CloudMart-Order-API-${Environment}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "CloudMart-Order-API-${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 6, "height": 6,
              "properties": {
                "title": "Lambda — Authorizer",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "CloudMart-Lambda-Authorizer-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "CloudMart-Lambda-Authorizer-${Environment}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "CloudMart-Lambda-Authorizer-${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 18, "y": 8, "width": 6, "height": 6,
              "properties": {
                "title": "Lambda — Report Generator",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "CloudMart-Report-Lambda-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "CloudMart-Report-Lambda-${Environment}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "CloudMart-Report-Lambda-${Environment}"]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "RDS — CPU & Connections",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DBInstanceIdentifier}"],
                  ["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "RDS — Free Memory & Storage",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DBInstanceIdentifier}"],
                  ["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "RDS — Read/Write IOPS",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${DBInstanceIdentifier}"],
                  ["AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 20, "width": 6, "height": 6,
              "properties": {
                "title": "Business — Orders Placed",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["CloudMart/Operations", "OrdersPlaced", "Environment", "${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 6, "y": 20, "width": 6, "height": 6,
              "properties": {
                "title": "Business — Orders Cancelled",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["CloudMart/Operations", "OrdersCancelled", "Environment", "${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 20, "width": 6, "height": 6,
              "properties": {
                "title": "Business — Orders Failed",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["CloudMart/Operations", "OrdersFailed", "Environment", "${Environment}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 18, "y": 20, "width": 6, "height": 6,
              "properties": {
                "title": "Business — Low Stock Events",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["CloudMart/Operations", "LowStockEvents", "Environment", "${Environment}"]
                ]
              }
            }
          ]
        }

  # ==========================================================
  # BUSINESS METRIC ALARMS
  # ==========================================================

  OrdersCancelledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrdersCancelled
      AlarmDescription: Alarm when 5 or more orders are cancelled within a 5-minute period.
      Namespace: CloudMart/Operations
      MetricName: OrdersCancelled
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrdersFailed
      AlarmDescription: Alarm when one or more orders fail.
      Namespace: CloudMart/Operations
      MetricName: OrdersFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-LowStockEvents
      AlarmDescription: Alarm when one or more low stock events occur.
      Namespace: CloudMart/Operations
      MetricName: LowStockEvents
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # DATABASE ALARMS
  # ==========================================================

  RdsHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-RDS-HighCPU
      AlarmDescription: Alarm when RDS CPU utilization exceeds 80%.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  RdsLowStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-RDS-LowStorage
      AlarmDescription: Alarm when RDS free storage falls below 5GB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5368709120  # 5 GB in bytes
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # LAMBDA ALARMS
  # ==========================================================

  OrderLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrderLambda-Throttles
      AlarmDescription: Alarm when Order Lambda is throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Sub CloudMart-Order-API-${Environment}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  ProductLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-ProductLambda-Errors
      AlarmDescription: Alarm when Product Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub CloudMart-Product-API-${Environment}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  OrderLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrderLambda-Errors
      AlarmDescription: Alarm when Order Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub CloudMart-Order-API-${Environment}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  AuthorizerLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-AuthorizerLambda-Errors
      AlarmDescription: Alarm when Lambda Authorizer has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub CloudMart-Lambda-Authorizer-${Environment}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  ReportLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-ReportLambda-Errors
      AlarmDescription: Alarm when Report Lambda has one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub CloudMart-Report-Lambda-${Environment}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  # ==========================================================
  # API GATEWAY ALARMS
  # ==========================================================

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-API-4XX
      AlarmDescription: Alarm when API Gateway returns one or more 4XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub CloudMart-Product-Customer-Order-API-${Environment}
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-API-5XX
      AlarmDescription: Alarm when API Gateway returns one or more 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub CloudMart-Product-Customer-Order-API-${Environment}
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic

Outputs:
  OperationsDashboardName:
    Value: !Sub cloudmart-operations-${Environment}
  MonitoringAlarmTopicArn:
    Value: !Ref MonitoringAlarmTopic
  OrdersCancelledAlarmName:
    Value: !Ref OrdersCancelledAlarm