AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: CloudMart Authentication Stack


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # LAMBDA AUTHORIZER
  # ========================================================

  LambdaAuthorizer:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub CloudMart-Lambda-Authorizer-${Environment}


      # ----------------------------------------------------
      # Lambda runtime
      # ----------------------------------------------------

      Runtime: python3.12


      # ----------------------------------------------------
      # Lambda handler
      # ----------------------------------------------------

      Handler: lambda_function.lambda_handler


      # ----------------------------------------------------
      # Lambda source code
      # ----------------------------------------------------

      CodeUri: ../../src/authorizer/


      # ----------------------------------------------------
      # IAM ROLE
      #
      # Import role created by IAM stack
      # ----------------------------------------------------

      Role:
        Fn::ImportValue:
          !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}


      # ----------------------------------------------------
      # Lambda configuration
      # ----------------------------------------------------

      MemorySize: 128

      Timeout: 10


      # ----------------------------------------------------
      # Environment variables
      # ----------------------------------------------------

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment


      # ----------------------------------------------------
      # VPC configuration
      # ----------------------------------------------------

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-Lambda-SG-ID


        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-Private-Subnet-ID

          - Fn::ImportValue:
              !Sub CloudMart-Private-Subnet-2-ID


      # ----------------------------------------------------
      # Tags
      # ----------------------------------------------------

      Tags:

        Project:
          CloudMart

        Environment:
          !Ref Environment

        Component:
          Authentication


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ========================================================
  # AUTHORIZE LAMBDA ARN
  # ========================================================

  LambdaAuthorizerArn:

    Description:
      ARN of the CloudMart Lambda Authorizer

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Arn-${Environment}


  # ========================================================
  # AUTHORIZE LAMBDA NAME
  # ========================================================

  LambdaAuthorizerName:

    Description:
      Name of the CloudMart Lambda Authorizer

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Name-${Environment}