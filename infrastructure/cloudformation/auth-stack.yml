AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: Deployment environment


Resources:

  LambdaAuthorizer:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub CloudMart-Lambda-Authorizer-${Environment}

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      CodeUri: ../../src/authorizer/

      MemorySize: 128

      Timeout: 10

      Role:
        Fn::ImportValue:
          !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              CloudMart-Lambda-SG-ID

        SubnetIds:
          - Fn::ImportValue:
              CloudMart-Private-Subnet-ID

          - Fn::ImportValue:
              CloudMart-Private-Subnet-2-ID

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

      Tags:

        Project: CloudMart

        Environment:
          !Ref Environment

        Component: Authentication


Outputs:

  LambdaAuthorizerArn:

    Description:
      ARN of the CloudMart Lambda Authorizer

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Arn-${Environment}


  LambdaAuthorizerName:

    Description:
      Name of the CloudMart Lambda Authorizer

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Name-${Environment}