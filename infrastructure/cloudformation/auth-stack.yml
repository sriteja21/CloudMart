AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: CloudMart Authentication Stack

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # LAMBDA AUTHORIZER
  # ========================================================

  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub CloudMart-Lambda-Authorizer-${Environment}
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: ../../src/authorizer/
      MemorySize: 128
      Timeout: 10
      Role:
        Fn::ImportValue: !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: CloudMart-Lambda-SG-ID
        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-2-ID
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Tags:
        Project: CloudMart
        Environment: !Ref Environment
        Component: Authentication


  # ========================================================
  # INIT SCHEMA LAMBDA SECURITY GROUP
  # ========================================================

  InitSchemaLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Init Schema Lambda
      VpcId:
        Fn::ImportValue: CloudMart-VPC-ID
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CloudMart-InitSchema-Lambda-SG
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # INIT SCHEMA LAMBDA
  # ========================================================

  InitSchemaLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub CloudMart-InitSchema-${Environment}
      CodeUri: ../../src/init-schema/
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref InitSchemaLambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-2-ID
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*"
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Tags:
        Project: CloudMart
        Environment: !Ref Environment
        Component: Database


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  LambdaAuthorizerArn:
    Description: ARN of the CloudMart Lambda Authorizer
    Value: !GetAtt LambdaAuthorizer.Arn
    Export:
      Name: !Sub CloudMart-Lambda-Authorizer-Arn-${Environment}

  LambdaAuthorizerName:
    Description: Name of the CloudMart Lambda Authorizer
    Value: !Ref LambdaAuthorizer
    Export:
      Name: !Sub CloudMart-Lambda-Authorizer-Name-${Environment}

  InitSchemaLambdaArn:
    Description: ARN of the Schema Initialization Lambda
    Value: !GetAtt InitSchemaLambda.Arn
    Export:
      Name: !Sub CloudMart-InitSchemaLambdaArn-${Environment}

  InitSchemaLambdaName:
    Description: Name of the Schema Initialization Lambda
    Value: !Ref InitSchemaLambda
    Export:
      Name: !Sub CloudMart-InitSchemaLambdaName-${Environment}
