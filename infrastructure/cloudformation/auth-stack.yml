AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: CloudMart Authentication Stack


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:

    Type: String

    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: Deployment environment

  LambdaAuthorizerRoleArn:

    Type: String

    Description:
      ARN of the Lambda Authorizer IAM role created by the IAM stack


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  LambdaAuthorizer:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub CloudMart-Lambda-Authorizer-${Environment}

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      CodeUri: ../../src/authorizer/

      Role:
        !Ref LambdaAuthorizerRoleArn

      MemorySize: 128

      Timeout: 10

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment


      # ====================================================
      # NO VPC
      # ====================================================

      # The authorizer only needs to read the
      # authentication token from SSM.


      Tags:

        Project: CloudMart

        Environment:
          !Ref Environment

        Component: Authentication


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  LambdaAuthorizerArn:

    Description:
      ARN of the CloudMart Lambda Authorizer

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Arn-${Environment}


  LambdaAuthorizerName:

    Description:
      Name of the CloudMart Lambda Authorizer

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub CloudMart-Lambda-Authorizer-Name-${Environment}