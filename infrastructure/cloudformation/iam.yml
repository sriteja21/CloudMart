AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM and SSM Parameter Store Stack

# ==========================================================
# PARAMETERS
# ==========================================================


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  AuthToken:
    Type: String
    Default: test-token-12345
    NoEcho: true
    Description: Test authorization token

  DatabaseHost:
    Type: String
    Default: test-db.example.com
    Description: Test RDS database endpoint

  DatabasePort:
    Type: String
    Default: '3306'
    Description: RDS database port

  DatabaseName:
    Type: String
    Default: cloudmart
    Description: Test database name

  DatabaseUsername:
    Type: String
    Default: admin
    NoEcho: true
    Description: Test database username

  DatabasePassword:
    Type: String
    Default: TestPassword123!
    NoEcho: true
    Description: Test database password

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test
    Description: Test S3 bucket for daily reports

Resources:

  # ========================================================
  # SSM PARAMETERS
  # ========================================================

  # --------------------------------------------------------
  # AUTH TOKEN
  # --------------------------------------------------------

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/auth/token
      Type: SecureString
      Value: !Ref AuthToken
      Description: Authorization token for Lambda Authorizer

  # --------------------------------------------------------
  # DATABASE HOST
  # --------------------------------------------------------

  DatabaseHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/database/host
      Type: String
      Value: !Ref DatabaseHost
      Description: RDS database host

  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/database/port
      Type: String
      Value: !Ref DatabasePort
      Description: RDS database port

  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/database/name
      Type: String
      Value: !Ref DatabaseName
      Description: RDS database name

  # --------------------------------------------------------
  # DATABASE USERNAME
  # --------------------------------------------------------

  DatabaseUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/database/username
      Type: SecureString
      Value: !Ref DatabaseUsername
      Description: RDS database username

  # --------------------------------------------------------
  # DATABASE PASSWORD
  # --------------------------------------------------------

  DatabasePasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/database/password
      Type: SecureString
      Value: !Ref DatabasePassword
      Description: RDS database password

  # --------------------------------------------------------
  # REPORT S3 BUCKET
  # --------------------------------------------------------

  ReportS3BucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /app/${Environment}/s3/report-bucket
      Type: String
      Value: !Ref ReportS3BucketName
      Description: S3 bucket used to store daily sales reports


  # ========================================================
  # LAMBDA EXECUTION ROLE
  # ========================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-Lambda-Execution-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        - PolicyName: LambdaDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*

        - PolicyName: LambdaEventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'


  # ========================================================
  # REPORT LAMBDA ROLE
  # ========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-Report-Lambda-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ReportLambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        - PolicyName: ReportLambdaSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/s3/report-bucket

        - PolicyName: ReportLambdaS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ReportS3BucketName}/*


  # ========================================================
  # LAMBDA AUTHORIZER ROLE
  # ========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-Lambda-Authorizer-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/token

        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-LambdaExecutionRoleArn-${Environment}

  ReportLambdaRoleArn:
    Description: Report Lambda execution role ARN
    Value: !GetAtt ReportLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-ReportLambdaRoleArn-${Environment}

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer role ARN
    Value: !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name: !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}

  ReportS3BucketParameterName:
    Description: SSM parameter containing the report S3 bucket name
    Value: !Sub /app/${Environment}/s3/report-bucket
    Export:
      Name: !Sub CloudMart-ReportS3BucketParameter-${Environment}