AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM and SSM Parameter Store Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  AuthToken:
    Type: String
    Default: user-token-12345
    NoEcho: true
    Description: Authorization token for USER role

  ProductOwnerToken:
    Type: String
    Default: product-owner-token-12345
    NoEcho: true
    Description: Authorization token for PRODUCT_OWNER role

  AdminToken:
    Type: String
    Default: admin-token-12345
    NoEcho: true
    Description: Authorization token for ADMIN role

  DBUsername:
    Type: String
    Default: cloudmartadmin
    Description: RDS database username
    MinLength: 1
    MaxLength: 16

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS database password
    MinLength: 8
    MaxLength: 41

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test
    Description: S3 bucket used for daily reports

Resources:

  UserTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/auth/user-token
      Type: String
      Value:
        !Ref AuthToken
      Description: Authorization token for USER role

  ProductOwnerTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/auth/product-owner-token
      Type: String
      Value:
        !Ref ProductOwnerToken
      Description: Authorization token for PRODUCT_OWNER role

  AdminTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/auth/admin-token
      Type: String
      Value:
        !Ref AdminToken
      Description: Authorization token for ADMIN role

  DatabaseHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/database/host
      Type: String
      Value:
        Fn::ImportValue: CloudMart-DatabaseEndpoint
      Description: RDS database endpoint

  DatabasePortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/database/port
      Type: String
      Value:
        Fn::ImportValue: CloudMart-DatabasePort
      Description: RDS database port

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/database/name
      Type: String
      Value:
        Fn::ImportValue: CloudMart-DatabaseName
      Description: CloudMart database name

  DatabaseUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/database/username
      Type: String
      Value:
        !Ref DBUsername
      Description: RDS database username stored in Parameter Store

  DatabasePasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/database/password
      Type: String
      Value:
        !Ref DBPassword
      Description: RDS database password stored in Parameter Store

  ReportS3BucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        !Sub /app/${Environment}/s3/report-bucket
      Type: String
      Value:
        !Ref ReportS3BucketName
      Description: S3 bucket used to store daily sales reports

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Sub CloudMart-Lambda-Execution-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-Product-API-${Environment}:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-Order-API-${Environment}:*

        - PolicyName: LambdaDatabaseSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/password

        - PolicyName: LambdaEventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus

        - PolicyName: LambdaVPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Sub CloudMart-Lambda-Authorizer-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-Lambda-Authorizer-${Environment}:*

        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/user-token
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/product-owner-token
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/admin-token

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Sub CloudMart-CloudFormation-Execution-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudFormationDeploymentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'

              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudMart-*

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudMart-Lambda-Execution-Role-${Environment}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudMart-Lambda-Authorizer-Role-${Environment}

              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:GetAlias
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:CloudMart-*

              - Effect: Allow
                Action:
                  - apigateway:*
                Resource: '*'

              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/*

              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeAvailabilityZones
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'

              - Effect: Allow
                Action:
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:DescribeDBInstances
                  - rds:ModifyDBInstance
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:DescribeDBSubnetGroups
                  - rds:ModifyDBSubnetGroup
                  - rds:AddTagsToResource
                  - rds:ListTagsForResource
                Resource: '*'

              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ReportS3BucketName}

              - Effect: Allow
                Action:
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:DescribeEventBus
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:EnableRule
                  - events:DisableRule
                  - events:TagResource
                  - events:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/cloudmart-${Environment}-*

              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-low-stock-alerts
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-order-notifications

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-*

Outputs:

  LambdaExecutionRoleArn:
    Description: Product and Order Lambda execution role ARN
    Value:
      !GetAtt LambdaExecutionRole.Arn
    Export:
      Name:
        !Sub CloudMart-LambdaExecutionRoleArn-${Environment}

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer role ARN
    Value:
      !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name:
        !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}

  CloudFormationExecutionRoleArn:
    Description: CloudFormation execution role ARN
    Value:
      !GetAtt CloudFormationExecutionRole.Arn
    Export:
      Name:
        !Sub CloudMart-CloudFormationExecutionRoleArn-${Environment}

  ReportS3BucketParameterName:
    Description: SSM parameter containing the report S3 bucket name
    Value:
      !Sub /app/${Environment}/s3/report-bucket
    Export:
      Name:
        !Sub CloudMart-ReportS3BucketParameter-${Environment}

  DatabaseUsernameParameterName:
    Description: SSM parameter containing the RDS database username
    Value:
      !Sub /app/${Environment}/database/username
    Export:
      Name:
        !Sub CloudMart-DatabaseUsernameParameter-${Environment}

  DatabasePasswordParameterName:
    Description: SSM parameter containing the RDS database password
    Value:
      !Sub /app/${Environment}/database/password
    Export:
      Name:
        !Sub CloudMart-DatabasePasswordParameter-${Environment}

  UserTokenParameterName:
    Description: SSM parameter containing the USER authorization token
    Value:
      !Sub /app/${Environment}/auth/user-token
    Export:
      Name:
        !Sub CloudMart-UserTokenParameter-${Environment}

  ProductOwnerTokenParameterName:
    Description: SSM parameter containing the PRODUCT_OWNER authorization token
    Value:
      !Sub /app/${Environment}/auth/product-owner-token
    Export:
      Name:
        !Sub CloudMart-ProductOwnerTokenParameter-${Environment}

  AdminTokenParameterName:
    Description: SSM parameter containing the ADMIN authorization token
    Value:
      !Sub /app/${Environment}/auth/admin-token
    Export:
      Name:
        !Sub CloudMart-AdminTokenParameter-${Environment}