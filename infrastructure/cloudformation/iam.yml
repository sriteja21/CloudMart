AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM and SSM Parameter Store Stack


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  AuthToken:
    Type: String
    Default: test-token-12345
    NoEcho: true
    Description: Test authorization token


  DatabaseHost:
    Type: String
    Default: test-db.example.com
    Description: Test RDS database endpoint


  DatabasePort:
    Type: String
    Default: '3306'
    Description: RDS database port


  DatabaseName:
    Type: String
    Default: cloudmart
    Description: Test database name


  DatabaseUsername:
    Type: String
    Default: admin
    NoEcho: true
    Description: Test database username


  DatabasePassword:
    Type: String
    Default: TestPassword123!
    NoEcho: true
    Description: Test database password


  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test
    Description: Test S3 bucket for daily reports


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # SSM PARAMETERS
  # ========================================================

  # --------------------------------------------------------
  # AUTHORIZATION TOKEN
  # --------------------------------------------------------

  AuthTokenParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/auth/token

      Type: String

      Value:
        !Ref AuthToken

      Description:
        Authorization token for Lambda Authorizer


  # --------------------------------------------------------
  # DATABASE HOST
  # --------------------------------------------------------

  DatabaseHostParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/host

      Type: String

      Value:
        !Ref DatabaseHost

      Description:
        RDS database host


  # --------------------------------------------------------
  # DATABASE PORT
  # --------------------------------------------------------

  DatabasePortParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/port

      Type: String

      Value:
        !Ref DatabasePort

      Description:
        RDS database port


  # --------------------------------------------------------
  # DATABASE NAME
  # --------------------------------------------------------

  DatabaseNameParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/name

      Type: String

      Value:
        !Ref DatabaseName

      Description:
        RDS database name


  # --------------------------------------------------------
  # DATABASE USERNAME
  # --------------------------------------------------------

  DatabaseUsernameParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/username

      Type: String

      Value:
        !Ref DatabaseUsername

      Description:
        RDS database username


  # --------------------------------------------------------
  # DATABASE PASSWORD
  # --------------------------------------------------------

  DatabasePasswordParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/password

      Type: String

      Value:
        !Ref DatabasePassword

      Description:
        RDS database password


  # --------------------------------------------------------
  # REPORT S3 BUCKET
  # --------------------------------------------------------

  ReportS3BucketParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/s3/report-bucket

      Type: String

      Value:
        !Ref ReportS3BucketName

      Description:
        S3 bucket used to store daily sales reports


  # ========================================================
  # PRODUCT AND ORDER LAMBDA EXECUTION ROLE
  # ========================================================

  LambdaExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-Lambda-Execution-Role-${Environment}


      # ----------------------------------------------------
      # Lambda assumes this role
      # ----------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ----------------------------------------------------
      # Permissions
      # ----------------------------------------------------

      Policies:


        # ==================================================
        # CLOUDWATCH LOGS
        # ==================================================

        - PolicyName: LambdaCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ==================================================
        # DATABASE CONFIGURATION FROM SSM
        # ==================================================

        - PolicyName: LambdaDatabaseAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*


        # ==================================================
        # EVENTBRIDGE ACCESS
        # ==================================================

        - PolicyName: LambdaEventBridgeAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - events:PutEvents

                Resource: '*'


        # ==================================================
        # VPC ACCESS
        #
        # Product / Order Lambdas that connect to RDS
        # need these permissions.
        # ==================================================

        - PolicyName: LambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


  # ========================================================
  # LAMBDA AUTHORIZER ROLE
  # ========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-Lambda-Authorizer-Role-${Environment}


      # ----------------------------------------------------
      # Lambda assumes this role
      # ----------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ----------------------------------------------------
      # Authorizer permissions
      #
      # IMPORTANT:
      # No VPC/EC2 permissions are required because
      # the Lambda Authorizer is NOT inside the VPC.
      # ----------------------------------------------------

      Policies:


        # ==================================================
        # CLOUDWATCH LOGS
        # ==================================================

        - PolicyName: AuthorizerCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ==================================================
        # SSM AUTHORIZATION TOKEN ACCESS
        # ==================================================

        - PolicyName: AuthorizerSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/token


  # ========================================================
  # CLOUDFORMATION EXECUTION ROLE
  # ========================================================

  CloudFormationExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-CloudFormation-Execution-Role-${Environment}


      # ----------------------------------------------------
      # CloudFormation assumes this role
      # ----------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - cloudformation.amazonaws.com

            Action:
              - sts:AssumeRole


      # ----------------------------------------------------
      # CloudFormation deployment permissions
      # ----------------------------------------------------

      Policies:

        - PolicyName: CloudFormationDeploymentAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - ssm:*
                  - ec2:*
                  - logs:*
                  - rds:*
                  - s3:*
                  - events:*
                  - sns:*

                Resource: '*'


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ========================================================
  # PRODUCT / ORDER LAMBDA ROLE ARN
  # ========================================================

  LambdaExecutionRoleArn:

    Description:
      Product and Order Lambda execution role ARN

    Value:
      !GetAtt LambdaExecutionRole.Arn

    Export:

      Name:
        !Sub CloudMart-LambdaExecutionRoleArn-${Environment}


  # ========================================================
  # LAMBDA AUTHORIZER ROLE ARN
  # ========================================================

  LambdaAuthorizerRoleArn:

    Description:
      Lambda Authorizer role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:

      Name:
        !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}


  # ========================================================
  # CLOUDFORMATION EXECUTION ROLE ARN
  # ========================================================

  CloudFormationExecutionRoleArn:

    Description:
      CloudFormation execution role ARN

    Value:
      !GetAtt CloudFormationExecutionRole.Arn

    Export:

      Name:
        !Sub CloudMart-CloudFormationExecutionRoleArn-${Environment}


  # ========================================================
  # REPORT S3 BUCKET PARAMETER NAME
  # ========================================================

  ReportS3BucketParameterName:

    Description:
      SSM parameter containing the report S3 bucket name

    Value:
      !Sub /app/${Environment}/s3/report-bucket

    Export:

      Name:
        !Sub CloudMart-ReportS3BucketParameter-${Environment}