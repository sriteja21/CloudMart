AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM and SSM Parameter Store Stack


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  # --------------------------------------------------------
  # ENVIRONMENT
  # --------------------------------------------------------

  Environment:

    Type: String

    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: Deployment environment


  # --------------------------------------------------------
  # AUTHORIZATION TOKEN
  # --------------------------------------------------------

  AuthToken:

    Type: String

    Default: test-token-12345

    NoEcho: true

    Description: Authorization token for Lambda Authorizer


  # --------------------------------------------------------
  # REPORT S3 BUCKET
  # --------------------------------------------------------

  ReportS3BucketName:

    Type: String

    Default: cloudmart-dev-reports-test

    Description: S3 bucket used for daily reports


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # AUTH TOKEN
  # ========================================================

  AuthTokenParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/auth/token

      Type: String

      Value:
        !Ref AuthToken

      Description:
        Authorization token for Lambda Authorizer


  # ========================================================
  # DATABASE HOST
  # ========================================================

  DatabaseHostParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/host

      Type: String

      Value:
        Fn::ImportValue: CloudMart-DatabaseEndpoint

      Description:
        RDS database endpoint


  # ========================================================
  # DATABASE PORT
  # ========================================================

  DatabasePortParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/port

      Type: String

      Value:
        Fn::ImportValue: CloudMart-DatabasePort

      Description:
        RDS database port


  # ========================================================
  # DATABASE NAME
  # ========================================================

  DatabaseNameParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/name

      Type: String

      Value:
        Fn::ImportValue: CloudMart-DatabaseName

      Description:
        CloudMart database name


  # ========================================================
  # DATABASE USERNAME
  #
  # Automatically obtained from the RDS Secrets Manager
  # secret created by the database stack.
  # ========================================================

  DatabaseUsernameParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/username

      Type: String

      Value:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:username}}'

          - SecretArn:
              Fn::ImportValue: CloudMart-DatabaseSecretArn

      Description:
        RDS database username obtained from Secrets Manager


  # ========================================================
  # DATABASE PASSWORD
  #
  # Automatically obtained from the RDS Secrets Manager
  # secret created by the database stack.
  #
  # NOTE:
  # This copies the secret value into SSM as a String.
  # For production, preferably read the password directly
  # from Secrets Manager instead.
  # ========================================================

  DatabasePasswordParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/database/password

      Type: String

      Value:

        Fn::Sub:

          - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'

          - SecretArn:
              Fn::ImportValue: CloudMart-DatabaseSecretArn

      Description:
        RDS database password obtained from Secrets Manager


  # ========================================================
  # REPORT S3 BUCKET
  # ========================================================

  ReportS3BucketParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /app/${Environment}/s3/report-bucket

      Type: String

      Value:
        !Ref ReportS3BucketName

      Description:
        S3 bucket used to store daily sales reports


  # ========================================================
  # PRODUCT / ORDER LAMBDA EXECUTION ROLE
  # ========================================================

  LambdaExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-Lambda-Execution-Role-${Environment}


      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ------------------------------------------------------
      # LAMBDA POLICIES
      # ------------------------------------------------------

      Policies:


        # ====================================================
        # CLOUDWATCH LOGS
        # ====================================================

        - PolicyName: LambdaCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ====================================================
        # SSM DATABASE CONFIGURATION
        # ====================================================

        - PolicyName: LambdaDatabaseSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/database/*


        # ====================================================
        # SECRETS MANAGER
        #
        # Kept because other Lambda functions may read
        # the database secret directly.
        # ====================================================

        - PolicyName: LambdaDatabaseSecretAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - secretsmanager:GetSecretValue

                Resource:

                  Fn::ImportValue: CloudMart-DatabaseSecretArn


        # ====================================================
        # EVENTBRIDGE
        # ====================================================

        - PolicyName: LambdaEventBridgeAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - events:PutEvents

                Resource: '*'


        # ====================================================
        # VPC NETWORK INTERFACES
        #
        # Required because Lambda runs inside the VPC.
        # ====================================================

        - PolicyName: LambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


  # ========================================================
  # LAMBDA AUTHORIZER ROLE
  # ========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-Lambda-Authorizer-Role-${Environment}


      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ------------------------------------------------------
      # POLICIES
      # ------------------------------------------------------

      Policies:


        # ====================================================
        # CLOUDWATCH LOGS
        # ====================================================

        - PolicyName: AuthorizerCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ====================================================
        # AUTH TOKEN FROM SSM
        # ====================================================

        - PolicyName: AuthorizerSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/${Environment}/auth/token


  # ========================================================
  # CLOUDFORMATION EXECUTION ROLE
  # ========================================================

  CloudFormationExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-CloudFormation-Execution-Role-${Environment}


      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - cloudformation.amazonaws.com

            Action:
              - sts:AssumeRole


      # ------------------------------------------------------
      # DEPLOYMENT POLICY
      # ------------------------------------------------------

      Policies:

        - PolicyName: CloudFormationDeploymentAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - ssm:*
                  - ec2:*
                  - logs:*
                  - rds:*
                  - s3:*
                  - events:*
                  - sns:*
                  - secretsmanager:*

                Resource: '*'


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # --------------------------------------------------------
  # LAMBDA EXECUTION ROLE ARN
  # --------------------------------------------------------

  LambdaExecutionRoleArn:

    Description:
      Product and Order Lambda execution role ARN

    Value:
      !GetAtt LambdaExecutionRole.Arn

    Export:

      Name:
        !Sub CloudMart-LambdaExecutionRoleArn-${Environment}


  # --------------------------------------------------------
  # LAMBDA AUTHORIZER ROLE ARN
  # --------------------------------------------------------

  LambdaAuthorizerRoleArn:

    Description:
      Lambda Authorizer role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:

      Name:
        !Sub CloudMart-LambdaAuthorizerRoleArn-${Environment}


  # --------------------------------------------------------
  # CLOUDFORMATION EXECUTION ROLE ARN
  # --------------------------------------------------------

  CloudFormationExecutionRoleArn:

    Description:
      CloudFormation execution role ARN

    Value:
      !GetAtt CloudFormationExecutionRole.Arn

    Export:

      Name:
        !Sub CloudMart-CloudFormationExecutionRoleArn-${Environment}


  # --------------------------------------------------------
  # REPORT BUCKET PARAMETER
  # --------------------------------------------------------

  ReportS3BucketParameterName:

    Description:
      SSM parameter containing the report S3 bucket name

    Value:
      !Sub /app/${Environment}/s3/report-bucket

    Export:

      Name:
        !Sub CloudMart-ReportS3BucketParameter-${Environment}


  # --------------------------------------------------------
  # DATABASE USERNAME PARAMETER
  # --------------------------------------------------------

  DatabaseUsernameParameterName:

    Description:
      SSM parameter containing the RDS database username

    Value:
      !Sub /app/${Environment}/database/username

    Export:

      Name:
        !Sub CloudMart-DatabaseUsernameParameter-${Environment}


  # --------------------------------------------------------
  # DATABASE PASSWORD PARAMETER
  # --------------------------------------------------------

  DatabasePasswordParameterName:

    Description:
      SSM parameter containing the RDS database password

    Value:
      !Sub /app/${Environment}/database/password

    Export:

      Name:
        !Sub CloudMart-DatabasePasswordParameter-${Environment}