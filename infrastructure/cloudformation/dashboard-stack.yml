AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard Stack

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment

  DashboardInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the dashboard

  DashboardAMI:
    Type: AWS::EC2::Image::Id
    Default: ami-0e35ddab05955cf57
    Description: Ubuntu AMI for the dashboard EC2 instance


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ============================================================
  # EC2 INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:

    Type: AWS::IAM::InstanceProfile

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceProfileName:
        !Sub CloudMart-Dashboard-Profile-${Environment}

      Roles:

        - CloudMart-EC2Dashboard-Role


  # ============================================================
  # DASHBOARD EC2 INSTANCE
  # ============================================================

  Ec2DashboardV:

    Type: AWS::EC2::Instance

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      # --------------------------------------------------------
      # EC2 INSTANCE TYPE
      # --------------------------------------------------------

      InstanceType:
        !Ref DashboardInstanceType


      # --------------------------------------------------------
      # UBUNTU AMI
      # --------------------------------------------------------

      ImageId:
        !Ref DashboardAMI


      # --------------------------------------------------------
      # EXISTING IAM INSTANCE PROFILE
      # --------------------------------------------------------

      IamInstanceProfile:
        !Ref DashboardInstanceProfile


      # --------------------------------------------------------
      # EXISTING CLOUDMART EC2 SECURITY GROUP
      #
      # DO NOT CREATE A NEW SECURITY GROUP
      # --------------------------------------------------------

      SecurityGroupIds:

        - Fn::ImportValue:
            CloudMart-EC2-SG-ID


      # --------------------------------------------------------
      # EXISTING PUBLIC SUBNET
      # --------------------------------------------------------

      SubnetId:

        Fn::ImportValue:
          CloudMart-Public-Subnet-ID


      # --------------------------------------------------------
      # EC2 TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-Dashboard-${Environment}

        - Key: Environment
          Value:
            !Ref Environment

        - Key: Application
          Value: CloudMart-Dashboard


      # ========================================================
      # USER DATA
      # ========================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash

            set -euxo pipefail


            # ==================================================
            # LOGGING
            # ==================================================

            exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1


            echo "=================================================="
            echo "CloudMart Dashboard bootstrap started"
            echo "Environment: ${Environment}"
            echo "Region: ${AWS::Region}"
            echo "=================================================="


            # ==================================================
            # SYSTEM SETUP
            # ==================================================

            echo "[1/8] Updating package information..."

            apt update -y


            # ==================================================
            # INSTALL REQUIRED PACKAGES
            # ==================================================

            echo "[2/8] Installing required packages..."

            apt install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              mariadb-client \
              curl


            echo "Required packages installed."


            echo "Python version:"
            python3 --version


            echo "Git version:"
            git --version


            echo "Nginx version:"
            nginx -v


            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            echo "[3/8] Preparing dashboard directory..."

            rm -rf /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /var/log/cloudmart-dashboard


            # ==================================================
            # CLONE CLOUDMART REPOSITORY
            # ==================================================

            echo "[4/8] Cloning dashboard repository..."

            cd /opt


            git clone \
              --branch monitor \
              --single-branch \
              https://github.com/KundellaAnjali/cloudmart.git \
              cloudmart-dashboard


            echo "Repository cloned successfully."


            # ==================================================
            # SHOW CLONED FILES
            # ==================================================

            echo "Repository structure:"

            find /opt/cloudmart-dashboard -maxdepth 3 -type f | sort


            # ==================================================
            # VERIFY DASHBOARD APPLICATION
            # ==================================================

            echo "Checking dashboard application..."


            if [ ! -f /opt/cloudmart-dashboard/dashboard/app.py ]; then

              echo "ERROR: dashboard/app.py was not found."

              echo "Available files:"

              find /opt/cloudmart-dashboard -maxdepth 4 -type f | sort

              exit 1

            fi


            if [ ! -f /opt/cloudmart-dashboard/dashboard/requirements.txt ]; then

              echo "ERROR: dashboard/requirements.txt was not found."

              exit 1

            fi


            echo "Dashboard application verified."


            # ==================================================
            # PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "[5/8] Creating Python virtual environment..."


            python3 -m venv \
              /opt/cloudmart-dashboard/venv


            echo "Upgrading pip..."


            /opt/cloudmart-dashboard/venv/bin/pip install \
              --upgrade pip


            echo "Installing dashboard requirements..."


            /opt/cloudmart-dashboard/venv/bin/pip install \
              -r /opt/cloudmart-dashboard/dashboard/requirements.txt


            echo "Python dependencies installed successfully."


            # ==================================================
            # DASHBOARD ENVIRONMENT
            # ==================================================

            echo "Creating dashboard environment file..."


            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}

            ENVEOF


            chmod 600 /etc/cloudmart-dashboard.env


            # ==================================================
            # DASHBOARD SYSTEMD SERVICE
            # ==================================================

            echo "[6/8] Creating dashboard systemd service..."


            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICEEOF

            [Unit]

            Description=CloudMart Dashboard

            After=network.target


            [Service]

            Type=simple

            User=ubuntu

            WorkingDirectory=/opt/cloudmart-dashboard/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/opt/cloudmart-dashboard/venv/bin/python3 /opt/cloudmart-dashboard/dashboard/app.py

            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target

            SERVICEEOF


            echo "Reloading systemd..."


            systemctl daemon-reload


            echo "Enabling dashboard service..."


            systemctl enable cloudmart-dashboard


            echo "Starting dashboard service..."


            systemctl start cloudmart-dashboard


            echo "Dashboard service started."


            # ==================================================
            # WAIT FOR FLASK APPLICATION
            # ==================================================

            echo "Waiting for Flask application on port 5000..."


            for i in $(seq 1 30); do

              if curl -s http://127.0.0.1:5000/ > /dev/null 2>&1; then

                echo "Flask dashboard is responding."

                break

              fi

              echo "Waiting for Flask... attempt ${!i}/30"

              sleep 2

            done


            # ==================================================
            # CHECK DASHBOARD SERVICE
            # ==================================================

            echo "Dashboard service status:"


            systemctl --no-pager status cloudmart-dashboard || true


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            echo "[7/8] Configuring Nginx..."


            rm -f /etc/nginx/sites-enabled/default

            rm -f /etc/nginx/sites-available/cloudmart


            cat > /etc/nginx/sites-available/cloudmart <<'NGINXEOF'

            server {

                listen 80;

                server_name _;


                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            # ==================================================
            # ENABLE NGINX CONFIGURATION
            # ==================================================

            ln -sf \
              /etc/nginx/sites-available/cloudmart \
              /etc/nginx/sites-enabled/cloudmart


            # ==================================================
            # VALIDATE NGINX
            # ==================================================

            echo "Validating Nginx configuration..."


            nginx -t


            # ==================================================
            # START NGINX
            # ==================================================

            echo "Starting Nginx..."


            systemctl enable nginx

            systemctl restart nginx


            echo "Nginx started successfully."


            # ==================================================
            # FINAL HEALTH CHECK
            # ==================================================

            echo "[8/8] Running final health checks..."


            sleep 5


            echo "------------------------------------------"
            echo "Checking Flask on port 5000"
            echo "------------------------------------------"


            curl -v http://127.0.0.1:5000/ || true


            echo "------------------------------------------"
            echo "Checking Nginx on port 80"
            echo "------------------------------------------"


            curl -v http://127.0.0.1/ || true


            echo "------------------------------------------"
            echo "Checking Flask listening port"
            echo "------------------------------------------"


            ss -lntp | grep 5000 || true


            echo "------------------------------------------"
            echo "Checking Nginx listening port"
            echo "------------------------------------------"


            ss -lntp | grep ':80' || true


            echo "------------------------------------------"
            echo "Dashboard service status"
            echo "------------------------------------------"


            systemctl --no-pager status cloudmart-dashboard || true


            echo "------------------------------------------"
            echo "Nginx service status"
            echo "------------------------------------------"


            systemctl --no-pager status nginx || true


            echo "=================================================="
            echo "CloudMart Dashboard deployment completed."
            echo "=================================================="


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ------------------------------------------------------------
  # INSTANCE ID
  # ------------------------------------------------------------

  DashboardInstanceId:

    Description: Dashboard EC2 Instance ID

    Value:
      !Ref Ec2DashboardV


  # ------------------------------------------------------------
  # PUBLIC IP
  # ------------------------------------------------------------

  DashboardPublicIP:

    Description: Dashboard EC2 Public IP

    Value:
      !GetAtt Ec2DashboardV.PublicIp


  # ------------------------------------------------------------
  # PUBLIC DNS
  # ------------------------------------------------------------

  DashboardPublicDNS:

    Description: Dashboard EC2 Public DNS

    Value:
      !GetAtt Ec2DashboardV.PublicDnsName


  # ------------------------------------------------------------
  # DASHBOARD URL
  # ------------------------------------------------------------

  DashboardURL:

    Description: CloudMart Dashboard URL

    Value:
      !Sub
        - http://${PublicIP}
        - PublicIP:
            !GetAtt Ec2DashboardV.PublicIp