AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard EC2 infrastructure with Ubuntu, Nginx and Flask.


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

  InstanceType:
    Type: String
    Default: t3.micro

  DashboardApiUrl:
    Type: String
    Default: ''

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # DASHBOARD EC2 INSTANCE
  # ========================================================

  Ec2DashboardV:
    Type: AWS::EC2::Instance

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceType:
        Ref: InstanceType

      ImageId:
        Ref: UbuntuAmiId


      # ----------------------------------------------------
      # EXISTING DASHBOARD INSTANCE PROFILE
      #
      # Export contains:
      #
      # arn:aws:iam::<account-id>:instance-profile/
      # CloudMart-Dashboard-EC2-Profile-dev
      #
      # EC2 expects the INSTANCE PROFILE NAME.
      # Therefore extract the name from the ARN.
      # ----------------------------------------------------

      IamInstanceProfile:
        Fn::Select:
          - 1
          - Fn::Split:
              - /
              - Fn::ImportValue:
                  Fn::Sub: CloudMart-DashboardEC2InstanceProfileArn-${Environment}


      # ----------------------------------------------------
      # EXISTING EC2 SECURITY GROUP
      # ----------------------------------------------------

      SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-EC2-SG


      # ----------------------------------------------------
      # EXISTING PUBLIC SUBNET
      # ----------------------------------------------------

      SubnetId:
        Fn::ImportValue:
          Fn::Sub: CloudMart-Public-Subnet-ID


      # ----------------------------------------------------
      # TAGS
      # ----------------------------------------------------

      Tags:

        - Key: Name
          Value:
            Fn::Sub: CloudMart-Dashboard-${Environment}

        - Key: Environment
          Value:
            Ref: Environment

        - Key: Application
          Value: CloudMart-Dashboard


      # ====================================================
      # USER DATA
      # ====================================================

      UserData:
        Fn::Base64:
          Fn::Sub: |

            #!/bin/bash

            set -euxo pipefail


            # ==================================================
            # LOGGING
            # ==================================================

            exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1


            echo "=================================================="
            echo "CloudMart Dashboard bootstrap started"
            echo "=================================================="

            echo "Environment: ${Environment}"
            echo "Region: ${AWS::Region}"
            echo "Report bucket: ${ReportS3BucketName}"



            # ==================================================
            # 1. SYSTEM INFORMATION
            # ==================================================

            echo "[1/10] Checking Ubuntu system..."

            cat /etc/os-release

            echo "Kernel:"
            uname -a



            # ==================================================
            # 2. INSTALL REQUIRED PACKAGES
            # ==================================================

            echo "[2/10] Installing required packages..."

            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              curl \
              mariadb-client


            echo "Required packages installed."

            echo "Python:"
            python3 --version

            echo "Git:"
            git --version

            echo "Nginx:"
            nginx -v



            # ==================================================
            # 3. PREPARE DASHBOARD DIRECTORY
            # ==================================================

            echo "[3/10] Preparing dashboard directory..."

            rm -rf /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /var/log/cloudmart-dashboard



            # ==================================================
            # 4. CLONE DASHBOARD REPOSITORY
            # ==================================================

            echo "[4/10] Cloning dashboard repository..."

            git clone \
              --branch monitor \
              --single-branch \
              https://github.com/KundellaAnjali/cloudmart.git \
              /opt/cloudmart-dashboard


            echo "Repository cloned."

            cd /opt/cloudmart-dashboard


            echo "Current branch:"
            git branch --show-current


            echo "Latest commit:"
            git log -1 --oneline



            # ==================================================
            # 5. VERIFY DASHBOARD FILES
            # ==================================================

            echo "[5/10] Checking dashboard files..."

            if [ ! -f /opt/cloudmart-dashboard/dashboard/app.py ]; then

              echo "ERROR: dashboard/app.py was not found."

              echo "Repository contents:"

              find /opt/cloudmart-dashboard \
                -maxdepth 3 \
                -type f \
                | sort

              exit 1

            fi


            if [ ! -f /opt/cloudmart-dashboard/dashboard/requirements.txt ]; then

              echo "ERROR: dashboard/requirements.txt was not found."

              exit 1

            fi


            echo "Dashboard files found."



            # ==================================================
            # 6. CREATE PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "[6/10] Creating Python virtual environment..."

            python3 -m venv /opt/cloudmart-dashboard/venv


            /opt/cloudmart-dashboard/venv/bin/pip install \
              --upgrade pip


            /opt/cloudmart-dashboard/venv/bin/pip install \
              -r /opt/cloudmart-dashboard/dashboard/requirements.txt


            echo "Python dependencies installed."



            # ==================================================
            # 7. CREATE DASHBOARD ENVIRONMENT
            # ==================================================

            echo "[7/10] Creating dashboard environment..."

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            REPORT_BUCKET=${ReportS3BucketName}
            API_URL=${DashboardApiUrl}

            ENVEOF


            chmod 600 /etc/cloudmart-dashboard.env


            echo "Dashboard environment created."



            # ==================================================
            # 8. CREATE FLASK SYSTEMD SERVICE
            # ==================================================

            echo "[8/10] Creating Flask systemd service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICEEOF

            [Unit]
            Description=CloudMart Dashboard Flask Service
            After=network-online.target
            Wants=network-online.target

            [Service]

            Type=simple

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/opt/cloudmart-dashboard/venv/bin/python app.py

            Restart=always

            RestartSec=5

            StandardOutput=append:/var/log/cloudmart-dashboard/app.log

            StandardError=append:/var/log/cloudmart-dashboard/error.log


            [Install]

            WantedBy=multi-user.target

            SERVICEEOF



            # ==================================================
            # 9. CONFIGURE NGINX
            # ==================================================

            echo "[9/10] Configuring Nginx..."

            rm -f /etc/nginx/sites-enabled/default


            cat > /etc/nginx/sites-available/cloudmart-dashboard <<NGINXEOF

            server {

                listen 80 default_server;

                server_name _;


                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;

                    proxy_set_header X-Real-IP \$remote_addr;

                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto \$scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            ln -sf \
              /etc/nginx/sites-available/cloudmart-dashboard \
              /etc/nginx/sites-enabled/cloudmart-dashboard


            echo "Testing Nginx configuration..."

            nginx -t



            # ==================================================
            # 10. START SERVICES
            # ==================================================

            echo "[10/10] Starting dashboard services..."


            systemctl daemon-reload


            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            systemctl enable nginx

            systemctl restart nginx



            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask application..."


            for i in $(seq 1 30)
            do

              if curl -f -s http://127.0.0.1:5000/ > /dev/null
              then

                echo "Flask application is running."

                break

              fi


              echo "Waiting for Flask... attempt $i/30"

              sleep 2

            done



            # ==================================================
            # CHECK FLASK SERVICE
            # ==================================================

            echo "=================================================="
            echo "Flask service status"
            echo "=================================================="


            systemctl --no-pager status cloudmart-dashboard || true



            # ==================================================
            # CHECK FLASK PORT
            # ==================================================

            echo "=================================================="
            echo "Checking port 5000"
            echo "=================================================="


            ss -lntp | grep ':5000' || true



            # ==================================================
            # TEST FLASK DIRECTLY
            # ==================================================

            echo "=================================================="
            echo "Testing Flask directly"
            echo "=================================================="


            curl -I http://127.0.0.1:5000/ || true



            # ==================================================
            # CHECK NGINX
            # ==================================================

            echo "=================================================="
            echo "Nginx service status"
            echo "=================================================="


            systemctl --no-pager status nginx || true



            # ==================================================
            # TEST NGINX
            # ==================================================

            echo "=================================================="
            echo "Testing Nginx"
            echo "=================================================="


            curl -I http://127.0.0.1/ || true



            # ==================================================
            # FINAL MESSAGE
            # ==================================================

            echo "=================================================="
            echo "CloudMart Dashboard bootstrap completed"
            echo "=================================================="


Outputs:

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value:
      Ref: Ec2DashboardV

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP
    Value:
      Fn::GetAtt:
        - Ec2DashboardV
        - PublicIp

  DashboardPublicDNS:
    Description: Dashboard EC2 Public DNS
    Value:
      Fn::GetAtt:
        - Ec2DashboardV
        - PublicDnsName

  DashboardURL:
    Description: CloudMart Dashboard URL
    Value:
      Fn::Sub:
        - http://${DashboardIP}
        - DashboardIP:
            Fn::GetAtt:
              - Ec2DashboardV
              - PublicIp