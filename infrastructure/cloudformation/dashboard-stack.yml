AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard EC2 infrastructure with Ubuntu, Flask and Nginx.

Parameters:

  Environment:
    Type: String
    Default: dev

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu AMI ID for the EC2 instance

  InstanceType:
    Type: String
    Default: t3.micro

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  DashboardApiUrl:
    Type: String
    Default: ''
    Description: CloudMart API Gateway URL

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test


Resources:

  # ==========================================================
  # DASHBOARD EC2 INSTANCE
  # ==========================================================

  DashboardEC2Instance:
    Type: AWS::EC2::Instance

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceType: !Ref InstanceType

      ImageId: !Ref AmiId

      KeyName: !Ref KeyName

      # ======================================================
      # USE EXISTING INSTANCE PROFILE FROM IAM STACK
      # ======================================================

      IamInstanceProfile:
        Fn::ImportValue: !Sub
          - CloudMart-DashboardEC2InstanceProfileArn-${Env}
          - Env: !Ref Environment

      # ======================================================
      # USE EXISTING EC2 SECURITY GROUP
      # ======================================================

      SecurityGroupIds:
        - Fn::ImportValue: CloudMart-EC2-SG

      # ======================================================
      # USE EXISTING PUBLIC SUBNET
      # ======================================================

      SubnetId:
        Fn::ImportValue: CloudMart-Public-Subnet-ID

      Tags:
        - Key: Name
          Value: !Sub CloudMart-Dashboard-${Environment}

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart

      # ======================================================
      # UBUNTU USER DATA
      # ======================================================

      UserData:
        Fn::Base64:
          Fn::Sub: |

            #!/bin/bash

            set -euxo pipefail

            # ==================================================
            # LOGGING
            # ==================================================

            exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1

            echo "=================================================="
            echo "CloudMart Dashboard bootstrap started"
            echo "Environment: ${Environment}"
            echo "Region: ${AWS::Region}"
            echo "=================================================="


            # ==================================================
            # SYSTEM PACKAGES
            # ==================================================

            echo "[1/8] Installing required packages..."

            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              python3 \
              python3-pip \
              python3-venv \
              nginx \
              git \
              curl \
              unzip


            echo "Required packages installed."

            python3 --version

            git --version

            nginx -v


            # ==================================================
            # AWS REGION
            # ==================================================

            echo "[2/8] Configuring AWS environment..."

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            REPORT_BUCKET=${ReportS3BucketName}
            API_URL=${DashboardApiUrl}

            ENVEOF

            chmod 600 /etc/cloudmart-dashboard.env

            cat /etc/cloudmart-dashboard.env


            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            echo "[3/8] Preparing dashboard directory..."

            rm -rf /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /var/log/cloudmart-dashboard


            # ==================================================
            # CLONE DASHBOARD BRANCH
            # ==================================================

            echo "[4/8] Cloning dashboard branch..."

            git clone \
              --branch dashboard \
              --single-branch \
              https://github.com/sriteja21/CloudMart.git \
              /opt/cloudmart-dashboard

            cd /opt/cloudmart-dashboard

            echo "Repository cloned successfully."

            echo "Current branch:"
            git branch --show-current

            echo "Latest commit:"
            git log -1 --oneline


            # ==================================================
            # VERIFY DASHBOARD FILES
            # ==================================================

            echo "[5/8] Checking dashboard files..."

            if [ ! -f /opt/cloudmart-dashboard/src/dashboard/app.py ]; then
                echo "ERROR: app.py not found."
                find /opt/cloudmart-dashboard -maxdepth 4 -type f | head -100
                exit 1
            fi

            echo "app.py found."


            if [ ! -f /opt/cloudmart-dashboard/src/dashboard/requirements.txt ]; then
                echo "ERROR: requirements.txt not found."
                exit 1
            fi

            echo "requirements.txt found."


            # ==================================================
            # PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "[6/8] Creating Python environment..."

            python3 -m venv /opt/cloudmart-dashboard/venv

            /opt/cloudmart-dashboard/venv/bin/pip install --upgrade pip

            /opt/cloudmart-dashboard/venv/bin/pip install \
              -r /opt/cloudmart-dashboard/src/dashboard/requirements.txt


            echo "Python dependencies installed."


            # ==================================================
            # FLASK SYSTEMD SERVICE
            # ==================================================

            echo "[7/8] Configuring Flask dashboard..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICEEOF

            [Unit]
            Description=CloudMart Dashboard Flask Service
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard/src/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            Environment=PYTHONUNBUFFERED=1

            ExecStart=/opt/cloudmart-dashboard/venv/bin/python /opt/cloudmart-dashboard/src/dashboard/app.py

            Restart=always
            RestartSec=5

            StandardOutput=append:/var/log/cloudmart-dashboard/app.log
            StandardError=append:/var/log/cloudmart-dashboard/error.log

            [Install]
            WantedBy=multi-user.target

            SERVICEEOF


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            echo "Configuring Nginx..."

            rm -f /etc/nginx/sites-enabled/default

            cat > /etc/nginx/sites-available/cloudmart-dashboard <<NGINXEOF

            server {

                listen 80 default_server;

                listen [::]:80 default_server;

                server_name _;


                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;

                    proxy_set_header X-Real-IP \$remote_addr;

                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto \$scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            ln -sf \
              /etc/nginx/sites-available/cloudmart-dashboard \
              /etc/nginx/sites-enabled/cloudmart-dashboard


            # ==================================================
            # VALIDATE NGINX
            # ==================================================

            nginx -t


            # ==================================================
            # START FLASK
            # ==================================================

            echo "[8/8] Starting CloudMart Dashboard..."

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            # ==================================================
            # START NGINX
            # ==================================================

            systemctl enable nginx

            systemctl restart nginx


            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask application..."

            for i in $(seq 1 30); do

                if curl -s http://127.0.0.1:5000/ > /dev/null; then

                    echo "Flask application is responding."

                    break

                fi

                echo "Waiting for Flask... attempt ${i}/30"

                sleep 2

            done


            # ==================================================
            # FINAL SERVICE STATUS
            # ==================================================

            echo "=================================================="
            echo "CloudMart Dashboard Service Status"
            echo "=================================================="

            systemctl --no-pager status cloudmart-dashboard || true

            echo "=================================================="
            echo "Nginx Status"
            echo "=================================================="

            systemctl --no-pager status nginx || true


            # ==================================================
            # LOCAL TESTS
            # ==================================================

            echo "=================================================="
            echo "Testing Flask directly"
            echo "=================================================="

            curl -I http://127.0.0.1:5000/ || true


            echo "=================================================="
            echo "Testing Nginx"
            echo "=================================================="

            curl -I http://127.0.0.1/ || true


            echo "=================================================="
            echo "CloudMart Dashboard deployment completed."
            echo "=================================================="


  # ==========================================================
  # ELASTIC IP
  # ==========================================================

  DashboardElasticIP:
    Type: AWS::EC2::EIP

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: !Sub CloudMart-Dashboard-EIP-${Environment}


  # ==========================================================
  # ELASTIC IP ASSOCIATION
  # ==========================================================

  DashboardElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      InstanceId: !Ref DashboardEC2Instance
      AllocationId: !GetAtt DashboardElasticIP.AllocationId


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref DashboardEC2Instance

  DashboardPublicIP:
    Description: Dashboard Elastic IP
    Value: !Ref DashboardElasticIP

  DashboardURL:
    Description: CloudMart Dashboard URL
    Value: !Sub
      - http://${IP}
      - IP: !Ref DashboardElasticIP

  DashboardInstanceProfile:
    Description: Existing Dashboard EC2 Instance Profile used by this stack
    Value:
      Fn::ImportValue: !Sub
        - CloudMart-DashboardEC2InstanceProfileArn-${Env}
        - Env: !Ref Environment