AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard EC2 Stack

Parameters:

  Environment:
    Type: String
    Default: dev

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test

  DashboardApiUrl:
    Type: String
    Default: ""


Resources:

  # ==========================================================
  # DASHBOARD EC2 INSTANCE
  #
  # IAM Role and Instance Profile are created in iam.yml.
  # This stack imports the existing Instance Profile.
  # ==========================================================

  Ec2Dashboard:
    Type: AWS::EC2::Instance

    Properties:

      # ========================================================
      # INSTANCE CONFIGURATION
      # ========================================================

      InstanceType: t3.micro

      # Ubuntu 24.04 LTS - ap-south-1
      ImageId: ami-0e35ddab05955cf57

      # ========================================================
      # EXISTING IAM INSTANCE PROFILE
      # Created by iam.yml
      # ========================================================

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-DashboardEC2InstanceProfileArn-${Environment}

      # ========================================================
      # SECURITY GROUP
      # ========================================================

      SecurityGroupIds:
        - Fn::ImportValue:
            CloudMart-EC2-SG-ID

      # ========================================================
      # PUBLIC SUBNET
      # ========================================================

      SubnetId:
        Fn::ImportValue:
          CloudMart-Public-Subnet-ID

      # ========================================================
      # EC2 TAGS
      # ========================================================

      Tags:

        - Key: Name
          Value: !Sub CloudMart-Dashboard-${Environment}

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

      # ========================================================
      # USER DATA
      # ========================================================

      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash

            # ==================================================
            # FAIL FAST + LOGGING
            # ==================================================

            set -euxo pipefail

            exec > >(tee -a /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard-userdata -s 2>/dev/console) 2>&1

            echo "=========================================="
            echo "CloudMart Dashboard UserData Started"
            echo "=========================================="


            # ==================================================
            # AWS REGION
            # ==================================================

            export AWS_REGION="${AWS::Region}"
            export AWS_DEFAULT_REGION="${AWS::Region}"

            echo "AWS_REGION=${AWS_REGION}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"


            # ==================================================
            # WAIT FOR NETWORK
            # ==================================================

            echo "Waiting for network..."

            for i in $(seq 1 30)
            do

              if curl -fsS https://aws.amazon.com/ > /dev/null
              then

                echo "Network is available."

                break

              fi

              echo "Waiting for network... attempt ${i}/30"

              sleep 5

            done


            # ==================================================
            # SYSTEM SETUP
            # ==================================================

            export DEBIAN_FRONTEND=noninteractive

            echo "Updating apt packages..."

            apt-get update -y

            echo "Installing required packages..."

            apt-get install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              curl


            # ==================================================
            # DASHBOARD DIRECTORY
            # ==================================================

            echo "Preparing dashboard directory..."

            rm -rf /home/ubuntu/CloudMart

            cd /home/ubuntu


            # ==================================================
            # CLONE CLOUDMART REPOSITORY
            # ==================================================

            echo "Cloning CloudMart repository..."

            git clone \
              --branch dashboard \
              --single-branch \
              https://github.com/sriteja21/CloudMart.git \
              CloudMart


            # ==================================================
            # SET OWNERSHIP
            # ==================================================

            chown -R ubuntu:ubuntu /home/ubuntu/CloudMart


            # ==================================================
            # DASHBOARD DIRECTORY
            # ==================================================

            cd /home/ubuntu/CloudMart/src/dashboard

            echo "Dashboard directory:"
            pwd

            echo "Dashboard files:"
            ls -la


            # ==================================================
            # VERIFY REQUIREMENTS FILE
            # ==================================================

            if [ ! -f requirements.txt ]
            then

              echo "ERROR: requirements.txt not found."

              exit 1

            fi


            # ==================================================
            # PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "Creating Python virtual environment..."

            python3 -m venv /home/ubuntu/CloudMart/venv

            chown -R ubuntu:ubuntu /home/ubuntu/CloudMart/venv


            # ==================================================
            # INSTALL PYTHON DEPENDENCIES
            # ==================================================

            echo "Installing Python dependencies..."

            /home/ubuntu/CloudMart/venv/bin/pip install \
              --upgrade pip

            /home/ubuntu/CloudMart/venv/bin/pip install \
              -r requirements.txt


            # ==================================================
            # DASHBOARD ENVIRONMENT
            # ==================================================

            echo "Creating dashboard environment configuration..."

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}

            REPORT_BUCKET=${ReportS3BucketName}

            API_URL=${DashboardApiUrl}

            ENVEOF

            chmod 600 /etc/cloudmart-dashboard.env


            # ==================================================
            # SYSTEMD SERVICE
            # ==================================================

            echo "Creating CloudMart Dashboard systemd service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICEEOF'

            [Unit]
            Description=CloudMart Dashboard Flask Service
            After=network-online.target
            Wants=network-online.target

            [Service]

            Type=simple

            User=ubuntu

            Group=ubuntu

            WorkingDirectory=/home/ubuntu/CloudMart/src/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/home/ubuntu/CloudMart/venv/bin/python /home/ubuntu/CloudMart/src/dashboard/app.py

            Restart=always

            RestartSec=5

            StandardOutput=append:/var/log/cloudmart-dashboard.log

            StandardError=append:/var/log/cloudmart-dashboard-error.log

            [Install]

            WantedBy=multi-user.target

            SERVICEEOF


            # ==================================================
            # CREATE LOG FILES
            # ==================================================

            touch /var/log/cloudmart-dashboard.log

            touch /var/log/cloudmart-dashboard-error.log

            chown ubuntu:ubuntu \
              /var/log/cloudmart-dashboard.log

            chown ubuntu:ubuntu \
              /var/log/cloudmart-dashboard-error.log


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            echo "Configuring Nginx..."

            rm -f /etc/nginx/sites-enabled/default


            cat > /etc/nginx/sites-available/cloudmart-dashboard <<'NGINXEOF'

            server {

                listen 80 default_server;

                listen [::]:80 default_server;

                server_name _;

                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            # ==================================================
            # ENABLE NGINX CONFIGURATION
            # ==================================================

            ln -sf \
              /etc/nginx/sites-available/cloudmart-dashboard \
              /etc/nginx/sites-enabled/cloudmart-dashboard


            # ==================================================
            # TEST NGINX
            # ==================================================

            echo "Testing Nginx configuration..."

            nginx -t


            # ==================================================
            # START DASHBOARD
            # ==================================================

            echo "Starting CloudMart Dashboard..."

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            # ==================================================
            # CHECK FLASK SERVICE
            # ==================================================

            sleep 5

            if systemctl is-active --quiet cloudmart-dashboard
            then

              echo "CloudMart Dashboard service is running."

            else

              echo "ERROR: CloudMart Dashboard service failed."

              systemctl --no-pager status cloudmart-dashboard || true

              echo "========== DASHBOARD ERROR LOG =========="

              cat /var/log/cloudmart-dashboard-error.log || true

              exit 1

            fi


            # ==================================================
            # START NGINX
            # ==================================================

            echo "Starting Nginx..."

            systemctl enable nginx

            systemctl restart nginx


            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask application..."

            FLASK_READY=false

            for i in $(seq 1 30)
            do

              if curl -f -s http://127.0.0.1:5000/ > /dev/null
              then

                echo "Flask application is running."

                FLASK_READY=true

                break

              fi

              echo "Waiting for Flask... attempt ${i}/30"

              sleep 2

            done


            # ==================================================
            # FLASK FAILURE CHECK
            # ==================================================

            if [ "${FLASK_READY}" != "true" ]
            then

              echo "ERROR: Flask application did not start."

              echo "========== SYSTEMD STATUS =========="

              systemctl --no-pager status cloudmart-dashboard || true

              echo "========== FLASK ERROR LOG =========="

              cat /var/log/cloudmart-dashboard-error.log || true

              echo "========== FLASK OUTPUT LOG =========="

              cat /var/log/cloudmart-dashboard.log || true

              exit 1

            fi


            # ==================================================
            # TEST NGINX
            # ==================================================

            echo "Testing Nginx..."

            if curl -f -s http://127.0.0.1/ > /dev/null
            then

              echo "Nginx is successfully proxying to Flask."

            else

              echo "ERROR: Nginx test failed."

              systemctl --no-pager status nginx || true

              exit 1

            fi


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo "=========================================="
            echo "CloudMart Dashboard Deployment Completed"
            echo "=========================================="

            echo "Environment:"
            echo "${Environment}"

            echo "AWS Region:"
            echo "${AWS::Region}"

            echo "Repository:"
            echo "https://github.com/sriteja21/CloudMart"

            echo "Branch:"
            echo "dashboard"

            echo "Dashboard directory:"
            echo "/home/ubuntu/CloudMart/src/dashboard"

            echo "Python virtual environment:"
            echo "/home/ubuntu/CloudMart/venv"

            echo "Report bucket:"
            echo "${ReportS3BucketName}"

            echo "Dashboard API URL:"
            echo "${DashboardApiUrl}"


            echo "=========================================="
            echo "Flask Service Status"
            echo "=========================================="

            systemctl --no-pager status cloudmart-dashboard || true


            echo "=========================================="
            echo "Nginx Service Status"
            echo "=========================================="

            systemctl --no-pager status nginx || true


            echo "=========================================="
            echo "Flask Test"
            echo "=========================================="

            curl -I http://127.0.0.1:5000/ || true


            echo "=========================================="
            echo "Nginx Test"
            echo "=========================================="

            curl -I http://127.0.0.1/ || true


            echo "=========================================="
            echo "UserData Completed"
            echo "=========================================="


Outputs:

  # ==========================================================
  # DASHBOARD PUBLIC IP
  # ==========================================================

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP
    Value: !GetAtt Ec2Dashboard.PublicIp


  # ==========================================================
  # DASHBOARD PRIVATE IP
  # ==========================================================

  DashboardPrivateIP:
    Description: Dashboard EC2 Private IP
    Value: !GetAtt Ec2Dashboard.PrivateIp


  # ==========================================================
  # DASHBOARD INSTANCE ID
  # ==========================================================

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref Ec2Dashboard