AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard EC2 infrastructure with Nginx and Flask.

Parameters:

  Environment:
    Type: String
    Default: dev

  DashboardInstanceType:
    Type: String
    Default: t3.micro

  DashboardAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-ubuntu-latest/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  DashboardApiUrl:
    Type: String
    Default: ""

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test

Resources:

  # ==========================================================
  # DASHBOARD EC2 INSTANCE
  # ==========================================================

  Ec2DashboardV:
    Type: AWS::EC2::Instance

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceType:
        !Ref DashboardInstanceType

      ImageId:
        !Ref DashboardAMI

      # Existing IAM Instance Profile from IAM stack
      IamInstanceProfile:
        Fn::ImportValue: !Sub
          - CloudMart-DashboardEC2InstanceProfileArn-${Env}
          - Env: !Ref Environment

      # Existing EC2 Security Group
      SecurityGroupIds:
        - Fn::ImportValue: CloudMart-EC2-SG

      # Existing public subnet
      SubnetId:
        Fn::ImportValue: CloudMart-Public-Subnet-ID

      Tags:
        - Key: Name
          Value: !Sub CloudMart-Dashboard-${Environment}

        - Key: Environment
          Value: !Ref Environment

      UserData:
        Fn::Base64:
          !Sub |

            #!/bin/bash

            set -euxo pipefail

            exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1

            echo "=================================================="
            echo "CloudMart Dashboard bootstrap started"
            echo "Environment: ${Environment}"
            echo "Region: ${AWS::Region}"
            echo "=================================================="


            # ==================================================
            # 1. INSTALL REQUIRED PACKAGES
            # ==================================================

            echo "[1/9] Installing required packages..."

            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              curl \
              mariadb-client

            echo "Required packages installed."

            python3 --version
            git --version
            nginx -v


            # ==================================================
            # 2. PREPARE DASHBOARD DIRECTORY
            # ==================================================

            echo "[2/9] Preparing dashboard directory..."

            rm -rf /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /var/log/cloudmart-dashboard


            # ==================================================
            # 3. CLONE DASHBOARD BRANCH
            # ==================================================

            echo "[3/9] Cloning dashboard branch..."

            cd /opt

            git clone \
              --branch monitor \
              --single-branch \
              https://github.com/KundellaAnjali/cloudmart.git \
              cloudmart-dashboard

            echo "Repository cloned successfully."

            cd /opt/cloudmart-dashboard

            echo "Current branch:"
            git branch --show-current

            echo "Latest commit:"
            git log -1 --oneline


            # ==================================================
            # 4. VERIFY DASHBOARD FILES
            # ==================================================

            echo "[4/9] Checking dashboard files..."

            if [ ! -f /opt/cloudmart-dashboard/dashboard/app.py ]; then

              echo "ERROR: dashboard/app.py not found."

              find /opt/cloudmart-dashboard -maxdepth 3 -type f | sort

              exit 1

            fi

            if [ ! -f /opt/cloudmart-dashboard/dashboard/requirements.txt ]; then

              echo "ERROR: dashboard/requirements.txt not found."

              exit 1

            fi

            echo "Dashboard files found."


            # ==================================================
            # 5. PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "[5/9] Creating Python virtual environment..."

            python3 -m venv /opt/cloudmart-dashboard/venv

            /opt/cloudmart-dashboard/venv/bin/pip install --upgrade pip

            /opt/cloudmart-dashboard/venv/bin/pip install \
              -r /opt/cloudmart-dashboard/dashboard/requirements.txt

            echo "Python dependencies installed."


            # ==================================================
            # 6. DASHBOARD ENVIRONMENT VARIABLES
            # ==================================================

            echo "[6/9] Creating dashboard environment..."

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            REPORT_BUCKET=${ReportS3BucketName}
            API_URL=${DashboardApiUrl}

            ENVEOF

            chmod 600 /etc/cloudmart-dashboard.env


            # ==================================================
            # 7. FLASK SYSTEMD SERVICE
            # ==================================================

            echo "[7/9] Creating Flask systemd service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICEEOF

            [Unit]
            Description=CloudMart Dashboard Flask Service
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/opt/cloudmart-dashboard/venv/bin/python app.py

            Restart=always
            RestartSec=5

            StandardOutput=append:/var/log/cloudmart-dashboard/app.log
            StandardError=append:/var/log/cloudmart-dashboard/error.log

            [Install]
            WantedBy=multi-user.target

            SERVICEEOF


            # ==================================================
            # 8. NGINX CONFIGURATION
            # ==================================================

            echo "[8/9] Configuring Nginx..."

            rm -f /etc/nginx/sites-enabled/default

            cat > /etc/nginx/sites-available/cloudmart-dashboard <<NGINXEOF

            server {

                listen 80 default_server;

                server_name _;

                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;

                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;

                    proxy_set_header X-Real-IP \$remote_addr;

                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto \$scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF

            ln -sf \
              /etc/nginx/sites-available/cloudmart-dashboard \
              /etc/nginx/sites-enabled/cloudmart-dashboard

            nginx -t


            # ==================================================
            # 9. START SERVICES
            # ==================================================

            echo "[9/9] Starting dashboard..."

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard

            systemctl enable nginx

            systemctl restart nginx


            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask..."

            for i in $(seq 1 30); do

              if curl -f -s http://127.0.0.1:5000/ > /dev/null; then

                echo "Flask is running."

                break

              fi

              echo "Waiting for Flask... attempt ${i}/30"

              sleep 2

            done


            # ==================================================
            # FINAL SERVICE STATUS
            # ==================================================

            echo "=================================================="
            echo "Dashboard service status"
            echo "=================================================="

            systemctl --no-pager status cloudmart-dashboard || true

            echo "=================================================="
            echo "Nginx service status"
            echo "=================================================="

            systemctl --no-pager status nginx || true


            # ==================================================
            # LOCAL HEALTH TEST
            # ==================================================

            echo "=================================================="
            echo "Testing Flask"
            echo "=================================================="

            curl -I http://127.0.0.1:5000/ || true


            echo "=================================================="
            echo "Testing Nginx"
            echo "=================================================="

            curl -I http://127.0.0.1/ || true


            echo "=================================================="
            echo "CloudMart Dashboard deployment completed."
            echo "=================================================="


Outputs:

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref Ec2DashboardV

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP
    Value: !GetAtt Ec2DashboardV.PublicIp

  DashboardPublicDNS:
    Description: Dashboard EC2 Public DNS
    Value: !GetAtt Ec2DashboardV.PublicDnsName

  DashboardURL:
    Description: CloudMart Dashboard URL
    Value: !Sub
      - http://${PublicIP}
      - PublicIP: !GetAtt Ec2DashboardV.PublicIp