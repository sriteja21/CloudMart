AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard EC2 Stack

Parameters:

  Environment:
    Type: String
    Default: dev

  ReportS3BucketName:
    Type: String
    Default: cloudmart-dev-reports-test

  DashboardApiUrl:
    Type: String
    Default: ""

Resources:

  # ==========================================================
  # EC2 INSTANCE PROFILE
  # ==========================================================

  DashboardEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: !Sub CloudMart-Dashboard-EC2-Profile-${Environment}

      Roles:
        - Fn::ImportValue:
            !Sub CloudMart-DashboardEC2RoleArn-${Environment}


  # ==========================================================
  # DASHBOARD EC2 INSTANCE
  # ==========================================================

  Ec2Dashboard:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      # Ubuntu 24.04 LTS - ap-south-1
      ImageId: ami-0e35ddab05955cf57

      IamInstanceProfile:
        Ref: DashboardEC2InstanceProfile

      SecurityGroupIds:
        - Fn::ImportValue:
            CloudMart-EC2-SG

      SubnetId:
        Fn::ImportValue:
          CloudMart-Public-Subnet-ID

      Tags:
        - Key: Name
          Value: !Sub CloudMart-Dashboard-${Environment}

      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash

            set -euxo pipefail

            # ==================================================
            # AWS REGION
            # ==================================================

            export AWS_REGION=${AWS::Region}
            export AWS_DEFAULT_REGION=${AWS::Region}

            echo "AWS_REGION=$AWS_REGION"
            echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"


            # ==================================================
            # SYSTEM SETUP
            # ==================================================

            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              curl


            # ==================================================
            # DASHBOARD DIRECTORY
            # ==================================================

            rm -rf /home/ubuntu/CloudMart


            # ==================================================
            # CLONE DASHBOARD REPOSITORY
            # ==================================================

            cd /home/ubuntu

            git clone \
              --branch monitor \
              --single-branch \
              https://github.com/KundellaAnjali/cloudmart.git \
              CloudMart


            # ==================================================
            # DASHBOARD DIRECTORY
            # ==================================================

            cd /home/ubuntu/CloudMart/src/dashboard


            # ==================================================
            # PYTHON DEPENDENCIES
            # ==================================================

            pip3 install \
              --break-system-packages \
              -r requirements.txt


            # ==================================================
            # DASHBOARD ENVIRONMENT
            # ==================================================

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}

            REPORT_BUCKET=${ReportS3BucketName}

            API_URL=${DashboardApiUrl}

            ENVEOF

            chmod 600 /etc/cloudmart-dashboard.env


            # ==================================================
            # SYSTEMD SERVICE
            # ==================================================

            cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICEEOF'

            [Unit]
            Description=CloudMart Dashboard Flask Service
            After=network-online.target
            Wants=network-online.target

            [Service]

            Type=simple

            User=ubuntu

            WorkingDirectory=/home/ubuntu/CloudMart/src/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/usr/bin/python3 /home/ubuntu/CloudMart/src/dashboard/app.py

            Restart=always

            RestartSec=5

            StandardOutput=append:/var/log/cloudmart-dashboard.log

            StandardError=append:/var/log/cloudmart-dashboard-error.log


            [Install]

            WantedBy=multi-user.target

            SERVICEEOF


            # ==================================================
            # CREATE LOG FILES
            # ==================================================

            touch /var/log/cloudmart-dashboard.log

            touch /var/log/cloudmart-dashboard-error.log

            chown ubuntu:ubuntu /var/log/cloudmart-dashboard.log

            chown ubuntu:ubuntu /var/log/cloudmart-dashboard-error.log


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            rm -f /etc/nginx/sites-enabled/default


            cat > /etc/nginx/sites-available/cloudmart-dashboard <<'NGINXEOF'

            server {

                listen 80 default_server;

                server_name _;


                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            # ==================================================
            # ENABLE NGINX CONFIGURATION
            # ==================================================

            ln -sf \
              /etc/nginx/sites-available/cloudmart-dashboard \
              /etc/nginx/sites-enabled/cloudmart-dashboard


            # ==================================================
            # TEST NGINX
            # ==================================================

            nginx -t


            # ==================================================
            # START DASHBOARD
            # ==================================================

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            # ==================================================
            # START NGINX
            # ==================================================

            systemctl enable nginx

            systemctl restart nginx


            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask application..."

            for i in $(seq 1 30)
            do

              if curl -f -s http://127.0.0.1:5000/ > /dev/null
              then

                echo "Flask application is running."

                break

              fi

              echo "Waiting for Flask... attempt $i/30"

              sleep 2

            done


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo "=========================================="

            echo "CloudMart Dashboard Deployment Completed"

            echo "=========================================="

            echo "AWS Region:"
            echo "$AWS_REGION"

            echo "Dashboard directory:"
            echo "/home/ubuntu/CloudMart/src/dashboard"


            echo "Flask service:"
            systemctl --no-pager status cloudmart-dashboard || true


            echo "Nginx service:"
            systemctl --no-pager status nginx || true


            echo "Flask test:"
            curl -I http://127.0.0.1:5000/ || true


            echo "Nginx test:"
            curl -I http://127.0.0.1/ || true


Outputs:

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP
    Value: !GetAtt Ec2Dashboard.PublicIp

  DashboardPrivateIP:
    Description: Dashboard EC2 Private IP
    Value: !GetAtt Ec2Dashboard.PrivateIp

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref Ec2Dashboard