AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Dashboard Stack

Parameters:

  Environment:
    Type: String
    Default: dev

  DashboardInstanceType:
    Type: String
    Default: t3.micro

  DashboardAMI:
    Type: AWS::EC2::Image::Id
    Default: ami-0e35ddab05955cf57

Resources:

  # ============================================================
  # EC2 INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceProfileName: !Sub CloudMart-Dashboard-Profile-${Environment}

      Roles:
        - CloudMart-EC2Dashboard-Role


  # ============================================================
  # DASHBOARD EC2 INSTANCE
  # ============================================================

  Ec2DashboardV:
    Type: AWS::EC2::Instance

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      InstanceType: !Ref DashboardInstanceType

      ImageId: !Ref DashboardAMI

      IamInstanceProfile:
        Ref: DashboardInstanceProfile

      # Use the EXISTING CloudMart EC2 Security Group.
      # No new dashboard security group is created.

      SecurityGroupIds:
        - Fn::ImportValue: CloudMart-EC2-SG

      # Use the EXISTING public subnet.

      SubnetId:
        Fn::ImportValue: CloudMart-Public-Subnet-ID

      Tags:

        - Key: Name
          Value: !Sub CloudMart-Dashboard-${Environment}

        - Key: Environment
          Value: !Ref Environment

        - Key: Application
          Value: CloudMart-Dashboard

      UserData:

        Fn::Base64:
          !Sub |

            #!/bin/bash

            set -euxo pipefail


            # ==================================================
            # LOGGING
            # ==================================================

            exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1


            echo "=================================================="
            echo "CloudMart Dashboard bootstrap started"
            echo "Environment: ${Environment}"
            echo "Region: ${AWS::Region}"
            echo "=================================================="


            # ==================================================
            # SYSTEM SETUP
            # ==================================================

            echo "[1/8] Updating package information..."

            apt update -y


            echo "[2/8] Installing required packages..."

            apt install -y \
              git \
              nginx \
              python3 \
              python3-pip \
              python3-venv \
              mariadb-client \
              curl


            echo "Required packages installed."


            echo "Python version:"
            python3 --version


            echo "Git version:"
            git --version


            echo "Nginx version:"
            nginx -v


            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            echo "[3/8] Preparing dashboard directory..."

            rm -rf /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /var/log/cloudmart-dashboard


            # ==================================================
            # CLONE CLOUDMART REPOSITORY
            # ==================================================

            echo "[4/8] Cloning dashboard repository..."

            cd /opt

            git clone \
              --branch monitor \
              --single-branch \
              https://github.com/KundellaAnjali/cloudmart.git \
              cloudmart-dashboard


            echo "Repository cloned successfully."


            # ==================================================
            # VERIFY DASHBOARD
            # ==================================================

            echo "Checking dashboard files..."

            if [ ! -f /opt/cloudmart-dashboard/dashboard/app.py ]; then

              echo "ERROR: dashboard/app.py was not found."

              echo "Repository contents:"

              find /opt/cloudmart-dashboard -maxdepth 3 -type f | sort

              exit 1

            fi


            if [ ! -f /opt/cloudmart-dashboard/dashboard/requirements.txt ]; then

              echo "ERROR: dashboard/requirements.txt was not found."

              exit 1

            fi


            echo "Dashboard files verified."


            # ==================================================
            # PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "[5/8] Creating Python virtual environment..."

            python3 -m venv /opt/cloudmart-dashboard/venv


            echo "Installing Python dependencies..."

            /opt/cloudmart-dashboard/venv/bin/pip install \
              --upgrade pip


            /opt/cloudmart-dashboard/venv/bin/pip install \
              -r /opt/cloudmart-dashboard/dashboard/requirements.txt


            echo "Python dependencies installed."


            # ==================================================
            # DASHBOARD ENVIRONMENT
            # ==================================================

            echo "Creating dashboard environment file..."

            cat > /etc/cloudmart-dashboard.env <<ENVEOF

            ENVIRONMENT=${Environment}

            AWS_REGION=${AWS::Region}

            AWS_DEFAULT_REGION=${AWS::Region}

            ENVEOF


            chmod 600 /etc/cloudmart-dashboard.env


            # ==================================================
            # DASHBOARD SYSTEMD SERVICE
            # ==================================================

            echo "[6/8] Creating dashboard systemd service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICEEOF

            [Unit]

            Description=CloudMart Dashboard

            After=network.target


            [Service]

            Type=simple

            User=ubuntu

            WorkingDirectory=/opt/cloudmart-dashboard/dashboard

            EnvironmentFile=/etc/cloudmart-dashboard.env

            ExecStart=/opt/cloudmart-dashboard/venv/bin/python3 /opt/cloudmart-dashboard/dashboard/app.py

            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target

            SERVICEEOF


            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl start cloudmart-dashboard


            echo "Dashboard service started."


            # ==================================================
            # WAIT FOR FLASK
            # ==================================================

            echo "Waiting for Flask application on port 5000..."

            for i in $(seq 1 30); do

              if curl -s http://127.0.0.1:5000/ > /dev/null 2>&1; then

                echo "Flask dashboard is responding."

                break

              fi

              echo "Waiting for Flask... attempt ${i}/30"

              sleep 2

            done


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            echo "[7/8] Configuring Nginx..."

            rm -f /etc/nginx/sites-enabled/default

            rm -f /etc/nginx/sites-available/cloudmart


            cat > /etc/nginx/sites-available/cloudmart <<'NGINXEOF'

            server {

                listen 80;

                server_name _;


                access_log /var/log/nginx/cloudmart-dashboard-access.log;

                error_log /var/log/nginx/cloudmart-dashboard-error.log;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_connect_timeout 10s;

                    proxy_read_timeout 60s;

                }

            }

            NGINXEOF


            ln -sf \
              /etc/nginx/sites-available/cloudmart \
              /etc/nginx/sites-enabled/cloudmart


            # ==================================================
            # NGINX VALIDATION
            # ==================================================

            nginx -t


            # ==================================================
            # START NGINX
            # ==================================================

            systemctl enable nginx

            systemctl restart nginx


            echo "Nginx started."


            # ==================================================
            # FINAL HEALTH CHECK
            # ==================================================

            echo "[8/8] Running final health checks..."

            sleep 5


            echo "Checking Flask..."

            curl -v http://127.0.0.1:5000/ || true


            echo "Checking Nginx..."

            curl -v http://127.0.0.1/ || true


            echo "Checking services..."

            systemctl --no-pager status cloudmart-dashboard || true

            systemctl --no-pager status nginx || true


            echo "=================================================="
            echo "CloudMart Dashboard deployment completed."
            echo "=================================================="


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref Ec2DashboardV


  DashboardPublicIP:
    Description: Dashboard EC2 Public IP
    Value: !GetAtt Ec2DashboardV.PublicIp


  DashboardPublicDNS:
    Description: Dashboard EC2 Public DNS
    Value: !GetAtt Ec2DashboardV.PublicDnsName


  DashboardURL:
    Description: CloudMart Dashboard URL
    Value: !Sub
      - http://${PublicIP}
      - PublicIP: !GetAtt Ec2DashboardV.PublicIp