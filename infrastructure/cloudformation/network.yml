AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network and Security Stack.
  Creates the VPC, public and private subnets, route tables,
  Internet Gateway, security groups, and VPC endpoints.

Parameters:

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the CloudMart VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the private subnet

  AdminIp:
    Type: String
    Default: 0.0.0.0/0
    Description: Public IP address allowed to access EC2 using SSH

Resources:

  # --------------------------------------------------
  # VPC
  # --------------------------------------------------

  CloudMartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: CloudMart-VPC


  # --------------------------------------------------
  # SUBNETS
  # --------------------------------------------------

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: CloudMart-Public-Subnet


  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: CloudMart-Private-Subnet


  # --------------------------------------------------
  # INTERNET GATEWAY
  # --------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CloudMart-IGW


  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # --------------------------------------------------
  # PUBLIC ROUTE TABLE
  # --------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: CloudMart-Public-RouteTable


  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable


  # --------------------------------------------------
  # PRIVATE ROUTE TABLE
  # --------------------------------------------------

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: CloudMart-Private-RouteTable


  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable


  # --------------------------------------------------
  # EC2 SECURITY GROUP
  # --------------------------------------------------

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart Flask Dashboard
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIp

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-EC2-SG


  # --------------------------------------------------
  # LAMBDA SECURITY GROUP
  # --------------------------------------------------

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart Lambda functions
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-Lambda-SG


  # --------------------------------------------------
  # RDS SECURITY GROUP
  # --------------------------------------------------

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart RDS MySQL
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: CloudMart-RDS-SG


  # Lambda -> RDS MySQL
  LambdaToRDSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  # --------------------------------------------------
  # SSM PARAMETER STORE VPC ENDPOINT
  # --------------------------------------------------

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref LambdaSecurityGroup

      Tags:
        - Key: Name
          Value: CloudMart-SSM-Endpoint


  # --------------------------------------------------
  # S3 GATEWAY VPC ENDPOINT
  # --------------------------------------------------

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: CloudMart-S3-Endpoint


# ==================================================
# OUTPUTS
# ==================================================

Outputs:

  VPCId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC
    Export:
      Name: CloudMart-VPC-ID


  PublicSubnetId:
    Description: CloudMart Public Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: CloudMart-Public-Subnet-ID


  PrivateSubnetId:
    Description: CloudMart Private Subnet ID
    Value: !Ref PrivateSubnet
    Export:
      Name: CloudMart-Private-Subnet-ID


  PublicRouteTableId:
    Description: CloudMart Public Route Table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: CloudMart-Public-RouteTable-ID


  PrivateRouteTableId:
    Description: CloudMart Private Route Table ID
    Value: !Ref PrivateRouteTable
    Export:
      Name: CloudMart-Private-RouteTable-ID


  EC2SecurityGroupId:
    Description: CloudMart EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: CloudMart-EC2-SG-ID


  LambdaSecurityGroupId:
    Description: CloudMart Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: CloudMart-Lambda-SG-ID


  RDSSecurityGroupId:
    Description: CloudMart RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: CloudMart-RDS-SG-ID


  SSMEndpointId:
    Description: CloudMart SSM VPC Endpoint ID
    Value: !Ref SSMEndpoint
    Export:
      Name: CloudMart-SSM-Endpoint-ID


  S3EndpointId:
    Description: CloudMart S3 VPC Endpoint ID
    Value: !Ref S3Endpoint
    Export:
      Name: CloudMart-S3-Endpoint-ID