AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network and Security Stack.
  Creates the VPC, public and private subnets, route tables,
  Internet Gateway, security groups, and VPC endpoints.


Parameters:

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the CloudMart VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the first private subnet

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for the second private subnet

  AdminIp:
    Type: String
    Default: 0.0.0.0/0
    Description: Public IP address allowed to access EC2 using SSH


Resources:

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: CloudMart-VPC

        - Key: Project
          Value: CloudMart


  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      Tags:
        - Key: Name
          Value: CloudMart-Public-Subnet

        - Key: Project
          Value: CloudMart


  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      Tags:
        - Key: Name
          Value: CloudMart-Private-Subnet-1

        - Key: Project
          Value: CloudMart


  PrivateSubnet2:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false

      AvailabilityZone:
        !Select
          - 1
          - !GetAZs ''

      Tags:
        - Key: Name
          Value: CloudMart-Private-Subnet-2

        - Key: Project
          Value: CloudMart


  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: CloudMart-IGW

        - Key: Project
          Value: CloudMart


  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: CloudMart-Public-RouteTable

        - Key: Project
          Value: CloudMart


  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - VPCGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable


  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: CloudMart-Private-RouteTable

        - Key: Project
          Value: CloudMart


  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable


  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable


  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart Flask Dashboard
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIp

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-EC2-SG

        - Key: Project
          Value: CloudMart


  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart Lambda functions
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-Lambda-SG

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart RDS MySQL
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-RDS-SG

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  LambdaToRDSIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  SSMEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart SSM VPC Endpoint
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-SSM-Endpoint-SG

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: CloudMart-SSM-Endpoint

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: CloudMart-S3-Endpoint

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  EventBridgeEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart EventBridge VPC Endpoint
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: CloudMart-EventBridge-Endpoint-SG

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


  EventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref EventBridgeEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: CloudMart-EventBridge-Endpoint

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: dev


Outputs:

  VPCId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC
    Export:
      Name: CloudMart-VPC-ID


  PublicSubnetId:
    Description: CloudMart Public Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: CloudMart-Public-Subnet-ID


  PrivateSubnetId:
    Description: CloudMart Private Subnet 1 ID
    Value: !Ref PrivateSubnet
    Export:
      Name: CloudMart-Private-Subnet-ID


  PrivateSubnet2Id:
    Description: CloudMart Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: CloudMart-Private-Subnet-2-ID


  PublicRouteTableId:
    Description: CloudMart Public Route Table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: CloudMart-Public-RouteTable-ID


  PrivateRouteTableId:
    Description: CloudMart Private Route Table ID
    Value: !Ref PrivateRouteTable
    Export:
      Name: CloudMart-Private-RouteTable-ID


  EC2SecurityGroupId:
    Description: CloudMart EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: CloudMart-EC2-SG-ID


  LambdaSecurityGroupId:
    Description: CloudMart Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: CloudMart-Lambda-SG-ID


  RDSSecurityGroupId:
    Description: CloudMart RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: CloudMart-RDS-SG-ID


  SSMEndpointId:
    Description: CloudMart SSM VPC Endpoint ID
    Value: !Ref SSMEndpoint
    Export:
      Name: CloudMart-SSM-Endpoint-ID


  S3EndpointId:
    Description: CloudMart S3 VPC Endpoint ID
    Value: !Ref S3Endpoint
    Export:
      Name: CloudMart-S3-Endpoint-ID


  EventBridgeEndpointId:
    Description: CloudMart EventBridge VPC Endpoint ID
    Value: !Ref EventBridgeEndpoint
    Export:
      Name: CloudMart-EventBridge-Endpoint-ID