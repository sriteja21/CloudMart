AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: CloudMart Product Customer and Order API

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


Resources:

  ProductApiFunction:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-api

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      CodeUri: ../../src/product/

      MemorySize: 256

      Timeout: 30

      Role:
        Fn::ImportValue:
          !Sub cloudmart-${Environment}-lambda-execution-role-arn

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-lambda-sg-id

        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-1-id

          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-2-id

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

      Events:

        GetProducts:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /product

            Method: GET


        CreateProduct:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /product

            Method: POST


        GetProduct:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /product/{id}

            Method: GET


        UpdateProduct:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /product/{id}

            Method: PUT


        DeleteProduct:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /product/{id}

            Method: DELETE


  CustomerApiFunction:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-customer-api

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      CodeUri: ../../src/customer/

      MemorySize: 256

      Timeout: 30

      Role:
        Fn::ImportValue:
          !Sub cloudmart-${Environment}-lambda-execution-role-arn

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-lambda-sg-id

        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-1-id

          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-2-id

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

      Events:

        CreateCustomer:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /customer

            Method: POST

            Auth:
              Authorizer: NONE


        GetCustomers:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /customer

            Method: GET


        GetCustomer:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /customer/{id}

            Method: GET


        UpdateCustomer:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /customer/{id}

            Method: PUT


        DeleteCustomer:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /customer/{id}

            Method: DELETE


  OrderApiFunction:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-api

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      CodeUri: ../../src/order/

      MemorySize: 256

      Timeout: 30

      Role:
        Fn::ImportValue:
          !Sub cloudmart-${Environment}-lambda-execution-role-arn

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-lambda-sg-id

        SubnetIds:
          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-1-id

          - Fn::ImportValue:
              !Sub cloudmart-${Environment}-private-subnet-2-id

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

      Events:

        CreateOrder:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order

            Method: POST


        GetOrders:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order

            Method: GET


        GetOrder:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order/{id}

            Method: GET


        UpdateOrder:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order/{id}

            Method: PUT


        GetCustomerOrders:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order/customer/{id}

            Method: GET


        CancelOrder:

          Type: Api

          Properties:

            RestApiId:
              !Ref ProductApi

            Path: /order/{id}

            Method: PATCH


  ProductApi:

    Type: AWS::Serverless::Api

    Properties:

      Name:
        !Sub cloudmart-${Environment}-product-customer-order-api

      StageName:
        !Ref Environment

      EndpointConfiguration:
        Type: REGIONAL

      Cors:

        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

        AllowHeaders: "'Content-Type,Authorization,X-Customer-Id'"

        AllowOrigin: "'*'"

      Auth:

        DefaultAuthorizer: CloudMartAuthorizer

        Authorizers:

          CloudMartAuthorizer:

            FunctionArn:
              Fn::ImportValue:
                !Sub cloudmart-${Environment}-lambda-authorizer-arn

            FunctionPayloadType: REQUEST

            Identity:

              Headers:
                - Authorization

              ReauthorizeEvery: 0


Outputs:

  ProductApiUrl:

    Description: CloudMart API URL

    Value:

      !Sub
        - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

        - ApiId:
            !Ref ProductApi


  ProductApiFunctionArn:

    Description: CloudMart Product Lambda ARN

    Value:
      !GetAtt ProductApiFunction.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-product-api-lambda-arn


  ProductApiFunctionName:

    Description: CloudMart Product Lambda name

    Value:
      !Ref ProductApiFunction

    Export:
      Name:
        !Sub cloudmart-${Environment}-product-api-lambda-name


  CustomerApiFunctionArn:

    Description: CloudMart Customer Lambda ARN

    Value:
      !GetAtt CustomerApiFunction.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-customer-api-lambda-arn


  CustomerApiFunctionName:

    Description: CloudMart Customer Lambda name

    Value:
      !Ref CustomerApiFunction

    Export:
      Name:
        !Sub cloudmart-${Environment}-customer-api-lambda-name


  OrderApiFunctionArn:

    Description: CloudMart Order Lambda ARN

    Value:
      !GetAtt OrderApiFunction.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-order-api-lambda-arn


  OrderApiFunctionName:

    Description: CloudMart Order Lambda name

    Value:
      !Ref OrderApiFunction

    Export:
      Name:
        !Sub cloudmart-${Environment}-order-api-lambda-name